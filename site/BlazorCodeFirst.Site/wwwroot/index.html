<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <!-- Geist carries the page, JetBrains Mono carries every piece of machine text (the wordmark,
         which is a namespace, and all code). display=swap so first paint is never blocked on a
         font; the fallbacks are the platform's own UI and mono stacks. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" />
    <!-- tokens.css declares every custom property app.css reads. Both are asserted in site.yml:
         losing either link ships an unstyled page while every other check there stays green. -->
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/highlight.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <script type="importmap"></script>
    <!-- The reader's colour-scheme choice. Inline and in <head> because both halves of this have to
         happen before anything else on the page can:

         Applying it must beat first paint. Every route here is prerendered, so the published HTML
         is drawn long before the runtime starts; a reader whose stored choice disagrees with their
         operating system would otherwise watch the system's answer flash first.

         Handling the click must beat hydration, for the same reason. A handler owned by the
         component would not exist until WebAssembly has downloaded and re-rendered the header,
         leaving a button that looks pressable and silently is not -- the state CounterPage.cs
         documents and accepts for a demo the reader opened on purpose, which is a different bargain
         from a control that sits in the banner of every route. The listener is on document rather
         than on the button so that re-render replaces the element underneath it harmlessly.

         The attribute is the whole of the runtime state. css/tokens.css turns it into a palette,
         and localStorage only carries it between loads. site.yml asserts this block survives into
         the published HTML: losing it ships a flashing page and a dead control while every other
         assertion there stays green. -->
    <script>
        (function () {
            var KEY = "theme";
            var ORDER = [null, "light", "dark"];
            var root = document.documentElement;

            function apply(value) {
                if (value === "light" || value === "dark") {
                    root.setAttribute("data-theme", value);
                } else {
                    root.removeAttribute("data-theme");
                }
            }

            // Storage is denied outright in some privacy modes, and reading it throws rather than
            // returning null. The theme is not worth failing the page over, so both directions are
            // guarded: the choice still applies for this page, and only its persistence is lost.
            try {
                apply(localStorage.getItem(KEY));
            } catch (e) {
                /* no stored choice is reachable; the system's answer stands */
            }

            document.addEventListener("click", function (event) {
                if (!(event.target instanceof Element)) {
                    return;
                }

                var button = event.target.closest("[data-theme-toggle]");
                if (!button) {
                    return;
                }

                // indexOf(null) is 0, so an absent attribute starts the cycle at "system". An
                // unrecognised value returns -1 and lands back on system too, which is the right
                // place for a state this code did not write.
                var next = ORDER[(ORDER.indexOf(root.getAttribute("data-theme")) + 1) % ORDER.length];
                apply(next);

                try {
                    if (next) {
                        localStorage.setItem(KEY, next);
                    } else {
                        localStorage.removeItem(KEY);
                    }
                } catch (e) {
                    /* the theme changed; only remembering it failed */
                }
            });
        })();
    </script>
</head>

<body>
    <!-- Deliberately empty. Every route is prerendered, so the published HTML has this element
         filled with real content before any script runs; the Blazor loading spinner that used to
         live here is stripped from the published output anyway
         (BlazorWasmPrerenderingDeleteLoadingContents). During `dotnet run`, which serves this file
         raw, the app is briefly blank until WASM starts. -->
    <div id="app"></div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
