<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/highlight.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <script type="importmap"></script>
</head>

<body>
    <!-- Deliberately empty. Every route is prerendered, so the published HTML has this element
         filled with real content before any script runs; the Blazor loading spinner that used to
         live here is stripped from the published output anyway
         (BlazorWasmPrerenderingDeleteLoadingContents). During `dotnet run`, which serves this file
         raw, the app is briefly blank until WASM starts. -->
    <div id="app"></div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
