version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - "area: build"
    groups:
      # Every major so far changed something worth reading: a runner floor, where
      # credentials are written, or which wrangler gets installed (#113). Those
      # arrive one per pull request. Everything below a major is noise and travels
      # together.
      actions:
        update-types:
          - minor
          - patch
        patterns:
          - "*"

  - package-ecosystem: nuget
    # NuGet discovery does not recurse. For each configured directory it reads
    # only the files sitting directly in that directory to find an entry point
    # (*.sln, *.slnx, *.proj, *.csproj), then follows the project references out
    # of what it found. So "/" reaches BlazorCodeFirst.slnx, the seven projects
    # it lists, and the Directory.Packages.props they import — and nothing else.
    # The four projects under site/ are deliberately outside that solution and
    # set ManagePackageVersionsCentrally=false, so their seven inline versions
    # need a root of their own.
    #
    # The first run could not settle this by observation, because every package
    # in the repository was already current and the one pull request it produced
    # would have looked identical either way. It was settled by reading
    # dependabot-core instead: DiscoveryWorker.FindEntryPoints enumerates a
    # single directory deep, and Job.GetAllDirectories glob-expands the entries
    # below against the working tree.
    #
    # The glob is what keeps a site project added later from silently falling
    # outside the configuration; a matched directory holding no project file
    # costs one empty scan. Grouping still yields one pull request per group,
    # because the directory loop runs inside the group loop — so a package
    # versioned both centrally and inline under site/ moves in a single pull
    # request rather than two that could drift apart.
    directories:
      - "/"
      - "/site/**/*"
    schedule:
      interval: weekly
    labels:
      - "area: build"
    ignore:
      # A compatibility floor imposed on consumers of the generator, not a stale
      # pin. The rationale is on the PackageVersion entry in
      # Directory.Packages.props, and moving it is a breaking change (#116).
      - dependency-name: Microsoft.CodeAnalysis.CSharp
      # This repository's own package. The trim and diagnostic fixtures restore it
      # from a local feed that dotnet pack produces, so a bump proposed against the
      # published version would point them away from the build's own output.
      - dependency-name: BlazorCodeFirst
      # net10.0 is the baseline until the net11.0 multi-target lands (#117). An
      # 11.x ASP.NET Core package does not restore against it, so a major here
      # would be a red pull request every week rather than an upgrade.
      - dependency-name: Microsoft.AspNetCore.Components*
        update-types:
          - version-update:semver-major
    groups:
      # These ship as one set and version in lockstep, across both the central
      # file and the site's inline versions.
      aspnetcore:
        patterns:
          - Microsoft.AspNetCore.Components*
      # Build-time only, referenced with PrivateAssets, and they constrain no
      # consumer, so they move freely and together. Microsoft.CodeAnalysis.CSharp
      # is deliberately not here: see the ignore entry above.
      roslyn-analyzers:
        patterns:
          - Microsoft.CodeAnalysis.BannedApiAnalyzers
          - Microsoft.CodeAnalysis.PublicApiAnalyzers
      # bunit and AngleSharp move together, and the xunit pair exists both
      # centrally and inline under site/tools, where separate pull requests would
      # let the two copies drift. Majors are excluded so they stay individually
      # bisectable: Test.Sdk 17 to 18 removed a test protocol and swapped the
      # JSON stack under the whole test platform.
      test-stack:
        update-types:
          - minor
          - patch
        patterns:
          - xunit*
          - Microsoft.NET.Test.Sdk
          - bunit
          - AngleSharp

  - package-ecosystem: npm
    # Both browser suites are CI gates, so a Playwright update that breaks one has to surface as a
    # red pull request rather than sit unnoticed until someone runs the suite by hand: the
    # WebAppTests suite since #163, and the site suite since #251, where it runs after the publish
    # and before the deploy. Both are required checks on main: the site suite via `site-verified`,
    # which reports what the `verify` job did (#250). Each lockfile is also the cache key for its
    # job's downloaded browser, which only stays correct while the file moves with the package.
    directories:
      - "/tests/BlazorCodeFirst.WebAppTests/browser"
      - "/site/tests/browser"
    schedule:
      interval: weekly
    labels:
      - "area: build"
    groups:
      # The two suites pin the same three packages at the same versions, and one pull request per
      # directory would let those copies drift, exactly as the nuget test-stack group prevents for
      # the xunit pair. Majors are not excluded here as they are there, because a red pull request
      # still names the package that caused it: tsc --noEmit fails for typescript or @types/node,
      # and playwright test fails for @playwright/test.
      browser-suites:
        patterns:
          - "*"
