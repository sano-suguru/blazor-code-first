name: CI

on:
  push:
    branches: [main]
  # No base-branch filter: run on every pull request, including stacked PRs whose
  # base is another feature branch (a `branches:` filter matches the PR base, so
  # `[main]` would skip stacked PRs and force a retarget/reopen to trigger CI).
  pull_request:

# Cancel superseded runs for the same branch/PR so stacked-PR churn does not pile up.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            format: false
          - os: macos-latest
            rid: osx-arm64
            # `dotnet format` reads the same files and reaches the same verdict on either runner, so
            # it runs on one leg rather than both. It was placed here (1966fc04, 2026-08-17) because
            # this leg measured shorter at the time: over 11 green runs of main with the check on both,
            # the Linux leg averaged 149s and this one 130s, and the check itself was 25-44s of the
            # Linux leg; two runs since the move put this leg at 124s and 114s. Runner-to-runner spread
            # is wide enough (the Linux leg ranged 121-171s) that a single pair of runs cannot show
            # this, which is why the figures are means over a sample rather than one measurement.
            #
            # That comparison had already reversed one day later: 10 green runs sampled 2026-08-18
            # put this leg at a 139s mean (109-162s) against the Linux leg's 112s (93-128s) -- this leg
            # is now the slower one. The reversal is not the format check growing; it is that this
            # leg's OTHER steps now cost about as much as the Linux leg's total (139s minus the ~29s
            # mean format cost lands within a few seconds of 112s). Moving the check to the Linux leg
            # would not shorten the workflow for the same reason: it would relocate roughly the same
            # ~29s onto a leg whose own baseline is no cheaper, not remove it. The check stays on this
            # leg because no leg currently costs less overall with it, not because this leg is still
            # the shorter one -- and that comparison is volatile enough (it flipped within a day here)
            # that neither claim should be read as a standing fact rather than a sampled one.
            #
            # A job of its own would be faster still and would not be a required check, which is the
            # trade this declines: the repository ruleset requires both legs by name, so the
            # formatting gate stays inside one of them.
            format: true

    # Written out rather than left to the default, which is the job id followed by every matrix value
    # in order. The repository ruleset requires "build-test (ubuntu-latest, linux-x64)" and
    # "build-test (macos-latest, osx-arm64)" by name, and under the default the `format` key above
    # renamed both of them: GitHub reports a required check that never STARTED as pending rather than
    # skipped, so every pull request became unmergeable with nothing to re-run. Measured, not
    # assumed -- that is what the first push of this change did. Naming the legs here pins those two
    # strings to the two axes a reader would expect them to name, so a matrix key added later cannot
    # break the ruleset again.
    name: build-test (${{ matrix.os }}, ${{ matrix.rid }})

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet restore BlazorCodeFirst.slnx

      - run: dotnet build BlazorCodeFirst.slnx --no-restore

      # Enforce whitespace formatting, IDE code style, AND naming rules.
      # `dotnet build`/EnforceCodeStyleInBuild runs most IDE* analyzers but NOT naming (IDE1006)
      # or whitespace formatting, so the full `dotnet format` verification is their enforcement point.
      # One leg only; the matrix entry that turns it on says which and why.
      - if: matrix.format
        run: dotnet format BlazorCodeFirst.slnx --verify-no-changes --no-restore

      - run: dotnet test BlazorCodeFirst.slnx --no-build

      # DragonCurveGenerator.cs (samples/HeighwayDragon) has no UI or JS dependency, so its tests
      # run here directly against the .csproj rather than through samples/Samples.slnx, which
      # would also restore/build the sample app project -- excluded from CI (issue #295).
      - run: dotnet restore samples/HeighwayDragon.Tests/BlazorCodeFirst.Samples.HeighwayDragon.Tests.csproj

      - run: dotnet test samples/HeighwayDragon.Tests/BlazorCodeFirst.Samples.HeighwayDragon.Tests.csproj

      # The version is declared once, in eng/Versions.props, and read here rather than repeated
      # (#228). A literal copy in this file used to fail as "Package not found" from
      # verify-package.sh, which names the symptom and not the cause.
      - id: package-version
        run: echo "value=$(bash eng/package-version.sh)" >> "$GITHUB_OUTPUT"

      - run: dotnet pack src/BlazorCodeFirst.Runtime/BlazorCodeFirst.Runtime.csproj -c Release -o artifacts/package

      - run: bash eng/verify-package.sh artifacts/package/BlazorCodeFirst.${{ steps.package-version.outputs.value }}.nupkg

      - run: rm -rf artifacts/nuget-packages/blazorcodefirst/${{ steps.package-version.outputs.value }}

      - run: dotnet publish tests/BlazorCodeFirst.TrimTestApp/BlazorCodeFirst.TrimTestApp.csproj -c Release -r ${{ matrix.rid }} --self-contained true --configfile tests/BlazorCodeFirst.TrimTestApp/NuGet.config

      - run: dotnet test tests/BlazorCodeFirst.TrimTests/BlazorCodeFirst.TrimTests.csproj
        env:
          BLAZORCODEFIRST_TRIM_OUTPUT: ${{ github.workspace }}/tests/BlazorCodeFirst.TrimTestApp/bin/Release/net10.0/${{ matrix.rid }}/publish

  wasm-package:
    # Builds and publishes the only browser-wasm consumer that restores BlazorCodeFirst as a
    # package. What that catches, and why nothing else here can, is on the ItemGroup in
    # tests/BlazorCodeFirst.WasmPackageApp/BlazorCodeFirst.WasmPackageApp.csproj (#23).
    #
    # browser-wasm output does not vary with the host OS, so this runs on one OS rather than joining
    # the build-test matrix. Unlike the browser job below, which shares no step with build-test,
    # this one duplicates its `dotnet pack`: a parallel job cannot read another job's disk, and
    # passing the package through upload-artifact would mean `needs: build-test`, which trades a
    # repeated pack for a wait on the slowest matrix leg. The repeated pack is the price of the
    # parallelism, and it means the package tested here is a different build of the same source than
    # the one eng/verify-package.sh verified.
    #
    # No `dotnet workload install wasm-tools`; see CONTRIBUTING.md §Build and test for why none is
    # needed.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet pack src/BlazorCodeFirst.Runtime/BlazorCodeFirst.Runtime.csproj -c Release -o artifacts/package

      - run: dotnet publish tests/BlazorCodeFirst.WasmPackageApp/BlazorCodeFirst.WasmPackageApp.csproj -c Release --configfile tests/BlazorCodeFirst.WasmPackageApp/NuGet.config

      - run: bash eng/verify-wasm-package.sh tests/BlazorCodeFirst.WasmPackageApp/bin/Release/net10.0/publish/wwwroot

  browser:
    # The specs in tests/BlazorCodeFirst.WebAppTests/browser measure Blazor's JS renderer -- what it
    # does with the frames, rather than which frames were emitted. Nothing there is visible from
    # dotnet test and nothing there is OS-dependent, so this runs on one OS with one browser rather
    # than joining the build-test matrix; a second OS would double the browser download and measure
    # nothing new. It is a separate job so it runs alongside build-test instead of extending it.
    # Counted by rule rather than by number: the set has grown three times and the count was stale
    # each time.
    runs-on: ubuntu-latest
    # Runs inside Playwright's own image instead of `--with-deps` apt-installing Chromium's
    # system libraries onto the bare runner: that apt-get was observed hanging indefinitely
    # mid-fetch against the Ubuntu archive mirror on GitHub-hosted runners (#473), well past
    # apt's own Acquire::http::Timeout -- a retry loop around the hang bought nothing because
    # the hang itself was unbounded. The tag must track package-lock.json's pinned `playwright`
    # version exactly (currently 1.62.1); a mismatch fails the browser launch, not silently.
    # .NET builds and runs fine in this image -- confirmed by building WebAppTestHost inside it;
    # the image already carries libicu/libssl for the browsers' own sake.
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/BlazorCodeFirst.WebAppTests/browser/package-lock.json

      # Build the host up front. The webServer block in playwright.config.ts runs `dotnet run`
      # without --no-build, so MSBuild still runs its up-to-date check, but an already-built host
      # keeps that inside the webServer timeout instead of a full build. Only this project is
      # needed; the solution is build-test's job.
      - run: dotnet build tests/BlazorCodeFirst.WebAppTestHost/BlazorCodeFirst.WebAppTestHost.csproj

      - run: npm ci
        working-directory: tests/BlazorCodeFirst.WebAppTests/browser

      # Playwright's loader transpiles the specs and throws their types away, so a type error here
      # runs green and shows up only as noise in a contributor's editor (#254). This is the only
      # thing in the repository that reads them.
      - run: npx tsc --noEmit
        working-directory: tests/BlazorCodeFirst.WebAppTests/browser

      - run: npx playwright test
        working-directory: tests/BlazorCodeFirst.WebAppTests/browser

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: tests/BlazorCodeFirst.WebAppTests/browser/test-results
