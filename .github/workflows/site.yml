name: site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "src/**"
      - "eng/ci-assert.sh"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "src/**"
      - "eng/ci-assert.sh"
      - ".github/workflows/site.yml"
  workflow_dispatch:

# Commenting the preview URL needs pull-requests: write. Without an explicit block the job inherits
# the repository default, which is read-only on many repositories and would 403 at comment time.
permissions:
  contents: read
  pull-requests: write

concurrency:
  # github.ref is refs/pull/<number>/merge on a pull_request, so each PR gets its own group and
  # supersedes only itself.
  group: site-${{ github.ref }}
  # Never cancel an in-flight PRODUCTION deploy: `wrangler pages deploy` uploads incrementally, and a
  # cancelled upload would leave the live site as whatever partial state had been committed. This
  # keys on the REF rather than on the production/preview decision, so a workflow_dispatch from main
  # (a preview) is also protected from cancellation -- the safe direction.
  #
  # After this change workflow_dispatch can no longer produce a production deploy; it always deploys
  # to a "dispatch-<branch>" preview. To redeploy production without a new commit, re-run the push
  # workflow run: `gh run rerun <run-id>`.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the deployment target
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # Derive --branch from the production/preview decision rather than passing github.ref_name
          # straight through. Two ways that went wrong:
          #   * workflow_dispatch from main handed wrangler "main", i.e. a PRODUCTION deploy, while
          #     the noindex logic below treats any non-push run as a preview -- deindexing the live
          #     site.
          #   * On pull_request, github.ref_name is "<number>/merge", which is not a usable branch
          #     alias at all.
          # Context values arrive through env, not GitHub Actions expression interpolation directly
          # into the script, so a branch name cannot inject shell.
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "main" ]; then
            environment=production
            branch=main
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            environment=preview
            branch="pr-$PR_NUMBER"
          else
            # A dispatch on a branch whose name contains "/" would not survive as a Pages branch
            # alias, so flatten the separator.
            environment=preview
            branch="dispatch-${REF_NAME//\//-}"
          fi

          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "Deploying as $environment to Cloudflare Pages branch '$branch'"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Regenerate docs and verify freshness
        run: |
          dotnet run --project site/tools/BlazorCompose.Site.DocGen.Cli/BlazorCompose.Site.DocGen.Cli.csproj -- \
            site/content \
            site/BlazorCompose.Site/Content/Docs.g.cs \
            site/BlazorCompose.Site/wwwroot/css/highlight.css
          git diff --exit-code -- \
            site/BlazorCompose.Site/Content/Docs.g.cs \
            site/BlazorCompose.Site/wwwroot/css/highlight.css

      - name: DocGen unit tests
        run: dotnet test site/tools/BlazorCompose.Site.DocGen.Tests/BlazorCompose.Site.DocGen.Tests.csproj

      # site/ sits outside BlazorCompose.slnx, so it is outside the repository's main
      # `dotnet format` gate (see AGENTS.md). This step closes that gap for the site projects.
      # `dotnet format` requires a restored project; restore is left implicit here (no
      # --no-restore) rather than adding a separate restore step, since each `dotnet format`
      # invocation below already restores its own project on demand.
      - name: Format check (site/)
        run: |
          # Build the site app before formatting it. `dotnet format` loads each project as a Roslyn
          # workspace and compiles it, and the app's RenderBody comes from the BlazorCompose source
          # generator referenced as an analyzer ProjectReference. On a cold checkout that generator
          # assembly does not exist yet, so the workspace load reports CS0534 ("does not implement
          # inherited abstract member RenderBody") for every compose component and the step fails.
          # Building first produces the generator; the DocGen projects need no such step.
          dotnet build site/BlazorCompose.Site/BlazorCompose.Site.csproj
          dotnet format site/BlazorCompose.Site/BlazorCompose.Site.csproj --verify-no-changes
          dotnet format site/tools/BlazorCompose.Site.DocGen/BlazorCompose.Site.DocGen.csproj --verify-no-changes
          dotnet format site/tools/BlazorCompose.Site.DocGen.Cli/BlazorCompose.Site.DocGen.Cli.csproj --verify-no-changes
          dotnet format site/tools/BlazorCompose.Site.DocGen.Tests/BlazorCompose.Site.DocGen.Tests.csproj --verify-no-changes

      - name: Verify site source hygiene
        run: |
          set -euo pipefail

          # Mechanical guards for issues that slipped past human review during M4: 21 Japanese
          # trailing comments in two committed test files were caught only by a whole-branch
          # review at the very end, and nothing here caught CRLF/missing-newline drift either.
          #
          # This step does not source eng/ci-assert.sh even though it hand-rolls the same two
          # shell hazards that library exists to contain (see below). Its helpers all take a
          # single file plus an ERE, but neither check here fits that shape: the CJK scan is a
          # recursive `grep -rnP` over a directory tree, and the newline check walks a
          # `git ls-files` loop rather than testing one path. Reusing the library would mean
          # restructuring both checks around it rather than just calling it.

          echo "Checking for non-English (CJK) characters in site/**/*.cs and *.razor..."
          # Hiragana, katakana, CJK ideographs, and fullwidth forms. Deliberately excludes the
          # em dash (U+2014), which appears legitimately in existing English comments.
          #
          # grep exits 1 for "no match" and 2 for an error (for example a grep built without
          # PCRE, which rejects -P). An `if grep ...; then` guard treats both exit codes as
          # "clean", so a broken/unavailable -P support would make this check silently pass
          # forever -- the same class of defect as the negated-grep bug already fixed for this
          # same check. Capture the output and exit code separately so a check-level failure
          # (rc=2) is reported distinctly from a genuinely clean result (rc=1, no hits).
          set +e
          cjk_hits=$(grep -rnP --include='*.cs' --include='*.razor' --exclude-dir=bin --exclude-dir=obj \
              '[\x{3040}-\x{30FF}\x{4E00}-\x{9FFF}\x{FF00}-\x{FFEF}]' site/)
          cjk_rc=$?
          set -e
          if [ "$cjk_rc" -gt 1 ]; then
            echo "::error::the CJK source check could not run (grep exited $cjk_rc)" >&2
            exit 1
          fi
          if [ -n "$cjk_hits" ]; then
            echo "::error::Non-English (CJK) characters found at the file(s)/line(s) below. Source comments and documentation must be written in English." >&2
            printf '%s\n' "$cjk_hits" >&2
            exit 1
          fi

          echo "Checking for missing trailing newlines under site/..."
          # Mirrors the root .editorconfig's insert_final_newline = true. Uses `git ls-files` so
          # bin/ and obj/ are excluded automatically (they are gitignored, not build-detected).
          missing=0
          while IFS= read -r -d '' rel; do
            f="site/$rel"
            # Skip binary files (e.g. favicon.png): `file`'s mime-encoding detection is more
            # reliable across grep implementations than a raw NUL-byte scan. Known limitation:
            # `file` reports UTF-16 text without a BOM as "binary" too, so such a file would be
            # silently skipped here. No file under site/ is UTF-16 today (all tracked files are
            # us-ascii, utf-8, or the one genuinely binary favicon.png) -- this does not cover
            # every conceivable text encoding unconditionally.
            if [ "$(file -b --mime-encoding "$f")" = "binary" ]; then
              continue
            fi
            # Command substitution strips all trailing newlines, so a non-empty result here means
            # the file's last byte was not '\n'.
            if [ -s "$f" ] && [ -n "$(tail -c1 "$f")" ]; then
              echo "::error::$f is missing a trailing newline" >&2
              missing=1
            fi
          done < <(git -C site ls-files -z)
          # Must be an if/exit, not `! <command>`: under `set -e` a negated command is exempt from
          # errexit (POSIX), so relying on negation here would silently swallow this failure.
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi

      - name: Publish (static, trimmed)
        run: dotnet publish site/BlazorCompose.Site/BlazorCompose.Site.csproj -c Release

      - name: Verify prerendered shell and documents
        run: |
          set -euo pipefail
          . eng/ci-assert.sh

          P=site/BlazorCompose.Site/bin/Release/net10.0/publish/wwwroot

          # Every prerendered ROUTE, relative to $P. These carry the shell, exactly one <title>, and
          # exactly one active nav link.
          ROUTES="index.html counter/index.html docs/index.html"
          for slug in getting-started elements-and-decorations control-flow; do
            ROUTES="$ROUTES docs/$slug/index.html"
          done
          # Every prerendered HTML document. Identical to ROUTES today; 404.html joins this list once
          # the real 404 lands, and only this list, because no nav link points at /404 and so its
          # active-link expectation is zero rather than one.
          ALL_HTML="$ROUTES"

          # Attribute order in the generated HTML is class-before-href today; match either order so
          # a future emitter change cannot silently turn this guard into a no-op.
          assert_active_link() {
            assert_grep \
              "<a[^>]*class=\"nav-link active\"[^>]*href=\"$2\"|<a[^>]*href=\"$2\"[^>]*class=\"nav-link active\"" \
              "$1" "the nav link for '$2' is not marked active"
          }

          for f in $ROUTES; do
            assert_file "$P/$f" "this route was not prerendered"
            assert_grep 'class="site-nav"' "$P/$f" "the site shell (nav) is missing from this route"
            assert_count 'nav-link active' "$P/$f" 1 "exactly one nav link must be active on a prerendered route"
            assert_count '<title>' "$P/$f" 1 "a prerendered route must render exactly one title element"
          done

          # The prerendering wrappers must be gone. While they shipped, the prerendered markup was
          # inert and hidden under an opaque loader until WASM started, so it reached crawlers only.
          for f in $ALL_HTML; do
            assert_not_grep 'b-prerendering' "$P/$f" "a prerendering wrapper div survived into the published HTML, which hides the prerendered content from humans until WASM starts"
            assert_not_grep 'BlazorCompose\.Site\.styles\.css' "$P/$f" "the published HTML links the scoped-CSS bundle, which this project does not produce"
          done

          # The guard above is only correct while NO scoped CSS exists. The SDK does NOT inject the
          # <link> for the bundle -- that line is hand-written in index.html -- so if someone adds a
          # .razor.css, the bundle appears in the publish output and silently has no effect. Catch the
          # premise breaking rather than letting the guard above quietly enforce the wrong thing.
          assert_no_glob "$P" '*.styles.css' "a scoped-CSS bundle appeared in the publish output, so a .razor.css was added: restore the <link href=\"BlazorCompose.Site.styles.css\"> line in wwwroot/index.html and drop the guard that forbids it"

          # InvariantGlobalization must actually remove the ICU payloads (about 2.6MB uncompressed).
          assert_no_glob "$P/_framework" 'icudt*.dat' "ICU data survived the publish, so InvariantGlobalization is not in effect"

          assert_active_link "$P/index.html" "/"
          assert_active_link "$P/counter/index.html" "/counter"

          # The per-route active check is the real guard: if path normalization is wrong, every route
          # renders the same active link.
          for slug in getting-started elements-and-decorations control-flow; do
            f="$P/docs/$slug/index.html"
            assert_active_link "$f" "/docs/$slug"
            assert_not_grep 'href="[^"]*\.md("|#|\?)' "$f" "an un-rewritten .md link survived into the prerendered HTML"
          done

          # "/docs" activates the default (lowest order) document.
          assert_active_link "$P/docs/index.html" "/docs/getting-started"

          # "/docs" must render the default document's BODY, not just mark its nav link active:
          # the nav check passes even when the page renders "Not found", so without this a broken
          # default-document resolution would ship on the one URL the spec promises to preserve.
          assert_grep '<h1>Getting Started</h1>' "$P/docs/index.html" "/docs did not render the default document's h1"
          assert_grep 'id="installation"' "$P/docs/index.html" "/docs did not render the default document's body"

          # Content conversion survived the AST pass.
          assert_grep 'id="installation"' "$P/docs/getting-started/index.html" "heading ids are missing"
          assert_grep 'class="csharp"' "$P/docs/getting-started/index.html" "code highlighting is missing"
          assert_grep 'class="headlink"' "$P/docs/control-flow/index.html" "heading permalinks are missing"
          assert_grep 'href="/docs/control-flow"' "$P/docs/getting-started/index.html" "a sibling .md link was not rewritten to its SPA route"
          assert_grep '<title>Getting Started</title>' "$P/docs/getting-started/index.html" "the per-page title is wrong or missing"

      - name: Verify the published _headers
        run: |
          set -euo pipefail
          . eng/ci-assert.sh

          P=site/BlazorCompose.Site/bin/Release/net10.0/publish/wwwroot

          # _headers is an ordinary wwwroot file, so if it ever stopped being published NOTHING else
          # in this workflow would fail -- and the preview injection below appends with ">>", which
          # would create a fresh file and succeed, deploying a _headers that has only the noindex
          # rule and no immutable cache rule. Asserting the contents BEFORE any injection catches
          # file loss, rule loss, and a mis-ordered workflow with one check.
          assert_file "$P/_headers" "the publish output has no _headers file"
          assert_grep '^/_framework/\*$' "$P/_headers" "the /_framework/* rule is missing from _headers"
          assert_grep '^  Cache-Control: public, max-age=31536000, immutable$' "$P/_headers" "the immutable cache directive is missing from the /_framework/* rule"
          assert_grep '^/404$' "$P/_headers" "the /404 rule is missing from _headers"
          assert_grep '^  X-Robots-Tag: noindex$' "$P/_headers" "the /404 noindex directive is missing from _headers"

      - name: Inject the preview noindex header
        if: steps.target.outputs.environment == 'preview'
        run: |
          set -euo pipefail
          . eng/ci-assert.sh

          P=site/BlazorCompose.Site/bin/Release/net10.0/publish/wwwroot

          # Cloudflare already sends X-Robots-Tag: noindex on every preview deployment by default, so
          # what this rule actually adds is `nofollow` plus an explicit, self-evident statement of
          # intent that does not depend on a platform default staying put.
          #
          # X-Robots-Tag only. robots.txt is deliberately NOT touched: "Disallow: /" stops the crawl,
          # so the crawler never reads the noindex and the two directives CANCEL rather than add.
          # The leading blank line keeps this a separate rule from the last one in the committed file.
          printf '\n/*\n  X-Robots-Tag: noindex, nofollow\n' >> "$P/_headers"

          assert_grep '^/\*$' "$P/_headers" "the injected preview rule has no /* path line"
          assert_grep '^  X-Robots-Tag: noindex, nofollow$' "$P/_headers" "the injected preview noindex directive is missing"

          echo "--- published _headers ---"
          cat "$P/_headers"

      - name: Deploy to Cloudflare Pages
        id: deploy
        # A pull_request from a fork gets no secrets, so the deploy would FAIL rather than skip.
        # Test the head repository explicitly instead of probing for an empty secret.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --branch comes from the resolved target, never from github.ref_name (see that step).
          command: >-
            pages deploy site/BlazorCompose.Site/bin/Release/net10.0/publish/wwwroot
            --project-name blazor-compose-site
            --branch=${{ steps.target.outputs.branch }}

      - name: Comment the preview URL on the pull request
        # Same fork condition as the deploy step: with no deployment there is no URL to post.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail

          # Prefer the branch alias (pr-N.<project>.pages.dev). A stable URL across redeploys is the
          # entire reason --branch is set explicitly; deployment-url is per-deployment and changes
          # every push, so it is only the fallback.
          url="$ALIAS_URL"
          if [ -z "$url" ]; then
            url="$DEPLOYMENT_URL"
          fi
          if [ -z "$url" ]; then
            echo "::error::the deploy step produced neither pages-deployment-alias-url nor deployment-url" >&2
            exit 1
          fi

          body=$(printf 'Preview deploy: %s\n\nServed with `X-Robots-Tag: noindex, nofollow`.\n' "$url")

          # Edit the bot's previous comment instead of stacking one per push. The `||` fallback covers
          # a gh build without --create-if-none.
          gh pr comment "$PR_NUMBER" --body "$body" --edit-last --create-if-none \
            || gh pr comment "$PR_NUMBER" --body "$body"
