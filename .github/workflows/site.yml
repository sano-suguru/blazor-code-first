name: site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "src/**"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "src/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Regenerate docs and verify freshness
        run: |
          dotnet run --project site/tools/BlazorCompose.Site.DocGen.Cli/BlazorCompose.Site.DocGen.Cli.csproj -- \
            site/content \
            site/BlazorCompose.Site/Content/Docs.g.cs \
            site/BlazorCompose.Site/wwwroot/css/highlight.css
          git diff --exit-code -- \
            site/BlazorCompose.Site/Content/Docs.g.cs \
            site/BlazorCompose.Site/wwwroot/css/highlight.css

      - name: DocGen unit tests
        run: dotnet test site/tools/BlazorCompose.Site.DocGen.Tests/BlazorCompose.Site.DocGen.Tests.csproj

      - name: Publish (static, trimmed)
        run: dotnet publish site/BlazorCompose.Site/BlazorCompose.Site.csproj -c Release

      - name: Verify prerendered shell and documents
        run: |
          set -euo pipefail
          P=site/BlazorCompose.Site/bin/Release/net10.0/publish/wwwroot

          # Attribute order in the generated HTML is class-before-href today; match either order so
          # a future emitter change cannot silently turn this guard into a no-op.
          active_link() {
            grep -qE "<a[^>]*class=\"nav-link active\"[^>]*href=\"$2\"|<a[^>]*href=\"$2\"[^>]*class=\"nav-link active\"" "$1"
          }

          # The shell must be present on every prerendered route.
          for f in index.html counter/index.html docs/index.html; do
            grep -q 'class="site-nav"' "$P/$f"
          done

          # Each document route is prerendered with the shell, exactly one title, its own nav link
          # marked active, and no leftover .md link. The per-route active check is the real guard: if
          # path normalization is wrong, every route renders the same active link.
          for slug in getting-started elements-and-decorations control-flow; do
            f="$P/docs/$slug/index.html"
            test -f "$f"
            grep -q 'class="site-nav"' "$f"
            active_link "$f" "/docs/$slug"
            test "$(grep -c '<title>' "$f")" = 1
            # Must be an if/exit, not `! grep ...`: under `set -e` a negated command is exempt from
            # errexit (POSIX), and this is not the script's last command, so a leftover .md link
            # would be detected and then silently ignored.
            if grep -qE 'href="[^"]*\.md("|#|\?)' "$f"; then
              echo "::error::$f still contains an un-rewritten .md link" >&2
              exit 1
            fi
          done

          # "/docs" activates the default (lowest order) document.
          active_link "$P/docs/index.html" "/docs/getting-started"

          # Content conversion survived the AST pass.
          grep -q 'id="installation"' "$P/docs/getting-started/index.html"
          grep -q 'class="csharp"' "$P/docs/getting-started/index.html"
          grep -q 'class="headlink"' "$P/docs/control-flow/index.html"
          grep -q 'href="/docs/control-flow"' "$P/docs/getting-started/index.html"
          grep -q '<title>Getting Started</title>' "$P/docs/getting-started/index.html"

      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Explicit --branch so a push to main deploys to PRODUCTION. Without it, CI runs on a
          # detached HEAD and wrangler falls back to a preview deployment. github.ref_name is
          # "main" on the push trigger and the branch name on a manual workflow_dispatch (preview).
          command: >-
            pages deploy site/BlazorCompose.Site/bin/Release/net10.0/publish/wwwroot
            --project-name blazor-compose-site
            --branch=${{ github.ref_name }}
