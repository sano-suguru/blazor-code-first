name: site

# No `paths:` filter on any trigger, deliberately, and #250 is why. A repository ruleset requires
# the `site-verified` job below before a pull request can merge, and GitHub reports a required check
# that never STARTED as pending rather than skipped -- so a filtered workflow would leave a pull
# request touching only DESIGN.md unmergeable with nothing to re-run. The filter moved into the
# `plan` job, which decides what the run has to do; every job here is gated on that decision, and
# `site-verified` is the one that always runs and always reports.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # github.ref is refs/pull/<number>/merge on a pull_request, so each PR gets its own group and
  # supersedes only itself.
  group: site-${{ github.ref }}
  # Never cancel an in-flight PRODUCTION deploy. Not because a cancelled run could leave a partial
  # site: `wrangler deploy` uploads a version and then points the deployment at it, so the live site
  # is only ever one whole version or the previous one. The reason is that pushes to main are rare
  # and a production deploy takes minutes, so there is nothing to gain by superseding one, and
  # letting it finish leaves the deployment history saying plainly which commit is live. This keys
  # on the REF rather than on the production/preview decision, so a workflow_dispatch from main (a
  # preview, see the target-resolution step below) is also protected -- the safe direction.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Everything this run needs to decide before it does any work: whether there is anything to
  # verify, and where a deploy would go. Both answers are needed by more than one job below, and
  # this job is the only one that runs unconditionally, so they are resolved once here rather than
  # recomputed per job. It checks nothing out -- both steps read the GitHub API and constants.
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Listing a pull request's files needs it. The push path uses the compare endpoint, which
      # contents: read already covers.
      pull-requests: read
    outputs:
      site: ${{ steps.changes.outputs.site }}
      environment: ${{ steps.target.outputs.environment }}
      alias: ${{ steps.target.outputs.alias }}
      command: ${{ steps.target.outputs.command }}
      origin: ${{ steps.target.outputs.origin }}
      preview_url: ${{ steps.target.outputs.preview_url }}
      deployed_url: ${{ steps.target.outputs.deployed_url }}
    steps:
      - name: Decide whether this run has anything to verify
        id: changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # THIS IS THE OLD `paths:` KEY, and it is now ordinary text that nothing validates. A new
          # input to the site build -- another script the verify job runs, another tree it reads --
          # has to be added here by hand. Wrong in the permissive direction costs a pointless run;
          # wrong in the other direction lets a change reach main unverified while the required
          # check reports green, so err towards matching too much.
          PATTERN='^(site/|src/|eng/ci-assert\.sh$|eng/verify-site-prerender\.sh$|eng/verify-tree-clean\.sh$|\.github/workflows/site\.yml$)'

          case "$EVENT_NAME" in
            pull_request)
              # The API rather than `git diff`, so this job needs no checkout and no fetch depth.
              files=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename')
              ;;
            push)
              # github.event.before is all-zeros on the first push to a ref and names a discarded
              # commit after a force push, and neither can be compared against. Treat such a run as
              # changed rather than guessing: being wrong here would skip verification.
              if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
                echo "site=true" >> "$GITHUB_OUTPUT"
                echo "No usable base commit for this push, so the run is treated as changed."
                exit 0
              fi
              files=$(gh api --paginate "repos/$REPO/compare/$BEFORE...$SHA" --jq '.files[].filename')
              ;;
            *)
              # workflow_dispatch. Someone asked for this run by hand, so there is nothing to decide.
              echo "site=true" >> "$GITHUB_OUTPUT"
              echo "Dispatched by hand, so the run is treated as changed."
              exit 0
              ;;
          esac

          # Both endpoints cap the file list -- the compare one at 300 entries, the pull-request one
          # at 3000 -- and neither says in the body that it truncated. A capped list read as the whole
          # change is the one way this scan can answer "nothing changed" about a change that did
          # touch the site, so a list at or above the smaller cap is treated as changed instead of
          # being filtered. Nothing in this repository has come close; the guard costs three lines and
          # removes the failure mode rather than leaving it to be discovered.
          if [ "$(printf '%s\n' "$files" | wc -l | tr -d '[:space:]')" -ge 300 ]; then
            echo "site=true" >> "$GITHUB_OUTPUT"
            echo "The changed-file list reached the API's cap, so the run is treated as changed."
            exit 0
          fi

          # grep exits 1 for "no match" and >=2 for a check that could not run, and only the first is
          # a legitimate "nothing to verify". An `if grep ...` guard reads both as clean, which would
          # turn a broken scan into a permanently green required check -- the silent-pass shape
          # eng/ci-assert.sh exists to contain. Capture the status instead.
          set +e
          matched=$(printf '%s\n' "$files" | grep -E "$PATTERN")
          rc=$?
          set -e
          if [ "$rc" -gt 1 ]; then
            echo "::error::the change scan could not run (grep exited $rc)" >&2
            exit 1
          fi

          if [ -n "$matched" ]; then
            echo "site=true" >> "$GITHUB_OUTPUT"
            echo "The site's inputs changed:"
            printf '%s\n' "$matched"
          else
            echo "site=false" >> "$GITHUB_OUTPUT"
            echo "Nothing under the site's inputs changed, so there is nothing to verify or deploy."
          fi

      - name: Resolve the deployment target
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # Derive the preview alias from the production/preview decision rather than passing
          # github.ref_name straight through. Two ways that went wrong:
          #   * workflow_dispatch from main handed wrangler "main", i.e. a PRODUCTION deploy, while
          #     the noindex logic below treats any non-push run as a preview -- deindexing the live
          #     site.
          #   * On pull_request, github.ref_name is "<number>/merge", which is not a usable alias
          #     at all.
          # Context values arrive through env, not GitHub Actions expression interpolation directly
          # into the script, so a branch name cannot inject shell.
          #
          # A consequence of this decision: workflow_dispatch can no longer produce a production
          # deploy, from any ref including main; it always deploys to a "dispatch-<branch>" preview.
          # To redeploy production without a new commit, re-run the push workflow run instead:
          # `gh run rerun <run-id>`.
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "main" ]; then
            environment=production
            alias=
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            environment=preview
            alias="pr-$PR_NUMBER"
          else
            # A dispatch on a branch whose name contains "/" would not survive in a hostname, so
            # flatten the separator.
            environment=preview
            alias="dispatch-${REF_NAME//\//-}"
          fi

          # The Worker's name and the account's workers.dev subdomain, written here and nowhere else
          # in this workflow: production serves at "<worker>.<subdomain>" and a preview at
          # "<alias>-<worker>.<subdomain>", so the sitemap origin, the preview URL, and the alias
          # length budget below are all functions of these two. WORKER must equal the "name" in
          # site/wrangler.jsonc, which is the only other place it appears.
          WORKER=blazor-code-first-site
          SUBDOMAIN=snsgr.workers.dev

          # A DNS label may not exceed 63 characters, and a preview spends the Worker's name plus a
          # separator of that budget before the alias starts. Derived rather than written out, so
          # renaming the Worker cannot leave a stale number here. "pr-<N>" cannot reach the cap; a
          # dispatch from a long branch name can. Substring expansion returns the whole string when
          # it is already shorter, so this needs no length test.
          alias="${alias:0:$(( 63 - ${#WORKER} - 1 ))}"
          # Truncation can leave a trailing "-", which is not a legal way for a DNS label to end.
          alias="${alias%-}"

          # wrangler-action takes exactly one command, so the production/preview split is made here
          # rather than by duplicating the deploy step behind two `if:` conditions. `versions
          # upload` creates a version WITHOUT moving the production deployment onto it, so a
          # preview has no path to production even if this decision were wrong. --config is not
          # part of this string: it is constant, and it belongs beside the workingDirectory it is
          # made absolute for.
          #
          # The Worker has to EXIST before a preview can be uploaded for it: Cloudflare documents
          # that `versions upload` fails on a Worker that has never been deployed. Recreating this
          # deployment from nothing therefore starts with one `wrangler deploy`, from a machine or
          # from a push to main, and only then can a pull request produce a preview.
          if [ "$environment" = production ]; then
            command="deploy"
          else
            command="versions upload --preview-alias $alias"
          fi

          origin="https://$WORKER.$SUBDOMAIN"

          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "alias=$alias" >> "$GITHUB_OUTPUT"
          echo "command=$command" >> "$GITHUB_OUTPUT"
          echo "origin=$origin" >> "$GITHUB_OUTPUT"
          if [ -n "$alias" ]; then
            preview_url="https://$alias-$WORKER.$SUBDOMAIN"
            echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          fi

          # The one URL a browser should actually point at once `deploy` has run: production's own
          # origin, or the alias a preview was uploaded under. Resolved once here, next to the
          # environment/preview split that decides it, rather than left for `site-smoke` to re-derive
          # the same `environment == production` branch downstream.
          if [ "$environment" = production ]; then
            echo "deployed_url=$origin" >> "$GITHUB_OUTPUT"
          else
            echo "deployed_url=$preview_url" >> "$GITHUB_OUTPUT"
          fi

          echo "Deploying as $environment with: wrangler $command"

  # Everything that can fail on the source TREE, and nothing that reads the publish output. Its
  # sibling `site-publish` is the other half; the two run at once because neither reads what the
  # other writes -- the publish regenerates Docs.g.cs and Snippets.g.cs in its own checkout, from
  # the same site/content the freshness gate here re-derives them from. Between them they are what
  # the #250 split means by "the source and the publish output, and nothing that talks to
  # Cloudflare": a Cloudflare outage or an expired token cannot block a merge, because
  # `site-verified` reports on these and not on the deploy.
  site-source:
    needs: plan
    if: needs.plan.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Snippets.g.cs is gated the same way as the two document artifacts, and for one more reason.
      # A snippet may read a file that is also compiled -- /counter's figure is Pages/CounterPage.cs
      # -- so this diff is what stops a figure from falling behind the source it claims to show.
      #
      # The site app's build regenerates all three itself, which is why this step is written as a
      # diff rather than as the place regeneration happens: what it holds is that the committed
      # copies match, for the changes that build's own input list does not watch. The
      # GenerateSiteContent target in BlazorCodeFirst.Site.csproj names them, and site/README.md,
      # "Docs content pipeline", says why the three artifacts stay committed at all.
      - name: Regenerate docs and snippets, and verify freshness
        run: |
          dotnet run --project site/tools/BlazorCodeFirst.Site.DocGen.Cli/BlazorCodeFirst.Site.DocGen.Cli.csproj -- \
            site/content \
            site/BlazorCodeFirst.Site/Content/Docs.g.cs \
            site/BlazorCodeFirst.Site/wwwroot/css/highlight.css \
            site/snippets \
            site/BlazorCodeFirst.Site/Content/Snippets.g.cs
          git diff --exit-code -- \
            site/BlazorCodeFirst.Site/Content/Docs.g.cs \
            site/BlazorCodeFirst.Site/wwwroot/css/highlight.css \
            site/BlazorCodeFirst.Site/Content/Snippets.g.cs

      # The three steps below take site/Site.slnx, the solution that exists so the five projects
      # under site/ are named once rather than per command. site/ stays outside
      # BlazorCodeFirst.slnx -- site/README.md says why -- and this is a second solution over the
      # same directory, not a move into the first.
      #
      # This build is also what the format check needs. `dotnet format` loads each project as a
      # Roslyn workspace and compiles it, and the app's RenderView comes from the BlazorCodeFirst
      # source generator referenced as an analyzer ProjectReference. On a cold checkout that
      # generator assembly does not exist yet, so the workspace load reports CS0534 ("does not
      # implement inherited abstract member RenderView") for every compose component and the step
      # fails. Building first produces the generator; the site test project references the app, so
      # it gets the same generator from this build.
      - name: Build the site solution
        run: dotnet build site/Site.slnx

      # DocGen's own unit tests, and the site app's: the decisions its components make on input
      # site/content cannot hold, so no publish output can show them. DocsNavTests says why (#279).
      - name: Site and DocGen unit tests
        run: dotnet test site/Site.slnx --no-build

      # site/ sits outside BlazorCodeFirst.slnx, so it is outside the repository's main
      # `dotnet format` gate (see CONTRIBUTING.md, "Code style"). This step closes that gap for
      # the site projects.
      #
      # One invocation over the solution rather than five over the projects. `dotnet format` pays
      # for a workspace load per invocation and analyses the projects it is handed in parallel, so
      # five invocations serialise the expensive part and repeat its fixed cost: measured on an
      # 8-core machine, 24.5s for the five against 10.4s for the solution. --no-restore is safe
      # because the build above restored the whole solution.
      - name: Format check (site/)
        run: dotnet format site/Site.slnx --verify-no-changes --no-restore

      - name: Verify site source hygiene
        run: |
          set -euo pipefail

          # Mechanical guards for issues that slipped past human review on an earlier branch: 21 Japanese
          # trailing comments in two committed test files were caught only by a whole-branch
          # review at the very end, and nothing here caught CRLF/missing-newline drift either.
          #
          # This step does not source eng/ci-assert.sh even though it hand-rolls the same two
          # shell hazards that library exists to contain (see below). Its helpers all take a
          # single file plus an ERE, or a directory plus a glob, and neither check here fits either
          # shape: the CJK scan is a recursive `grep -rnP` over a directory tree, and the newline
          # check walks a `git ls-files` loop rather than testing one path. Reusing the library
          # would mean restructuring both checks around it rather than just calling it.

          echo "Checking for non-English (CJK) characters in site source and English content..."
          # Hiragana, katakana, CJK ideographs, and fullwidth forms. Deliberately excludes the
          # em dash (U+2014), which appears legitimately in existing English comments.
          #
          # The scan covers *.cs and *.razor, and now the English documents as well. It used to
          # stop at source, so Japanese in an English site/content/*.md went unnoticed: the rule
          # existed but could not bite where the prose actually is. Extending it here is what makes
          # site/content/ja/ a carved-out exception rather than the first place anyone noticed the
          # rule was unenforced.
          #
          # Three paths are excluded, for different reasons:
          #   * site/content/ja/ is the exception itself, named in CONTRIBUTING.
          #   * Docs.g.cs is generated FROM that directory. It is not a second exception; it is the
          #     same content after conversion, and scanning it would fail the build for the file
          #     doing its job. Nothing else generated carries prose, so the exclusion is by name
          #     rather than by a pattern that might quietly widen.
          #   * MarkdownConverterTests.cs asserts what the converter does to a Japanese paragraph,
          #     so its Japanese is the input under test rather than prose. Spelling those literals
          #     as \uXXXX would satisfy this scan and leave a reader unable to see what is asserted,
          #     which is the opposite of what a test is for. Unlike the two above it, this file is
          #     not exempt as a whole: what is exempt is its string literals, and the second scan
          #     below holds the rest of it. Naming the file keeps the exemption from widening
          #     quietly, for the same reason as Docs.g.cs above.
          #
          # grep exits 1 for "no match" and 2 for an error (for example a grep built without
          # PCRE, which rejects -P). An `if grep ...; then` guard treats both exit codes as
          # "clean", so a broken/unavailable -P support would make this check silently pass
          # forever -- the same class of defect as the negated-grep bug already fixed for this
          # same check. Capture the output and exit code separately so a check-level failure
          # (rc=2) is reported distinctly from a genuinely clean result (rc=1, no hits).
          #
          # --exclude-dir prunes by directory NAME at any depth, so it cannot express "the ja
          # directly under site/content". Each scan therefore drops its exempt paths afterwards,
          # with an anchored grep -v, so a future site/tools/ja/ would still be scanned.
          #
          # The exempt paths are dropped AFTER the exit code is captured, never through a pipe into
          # the same assignment. `hits=$(grep ... | grep -v ...)` reports the LAST command's status,
          # and a first grep that died with rc=2 produces no output, which the filter answers with
          # rc=1 -- indistinguishable from a clean scan. That is the silent-pass defect this check
          # has already been fixed for once.
          CJK_RANGE='[\x{3040}-\x{30FF}\x{4E00}-\x{9FFF}\x{FF00}-\x{FFEF}]'
          CJK_FIXTURE_FILE='site/tools/BlazorCodeFirst.Site.DocGen.Tests/MarkdownConverterTests.cs'

          set +e
          cjk_raw=$(grep -rnP --include='*.cs' --include='*.razor' --exclude-dir=bin --exclude-dir=obj \
              "$CJK_RANGE" site/)
          cjk_rc=$?
          # Both content file kinds: the documents, and the shell.yml each language declares its
          # non-document strings in. Scanning only *.md would leave the English shell text as the one
          # reader-facing file nothing checks.
          cjk_content_raw=$(grep -rnP --include='*.md' --include='*.yml' "$CJK_RANGE" site/content/)
          cjk_content_rc=$?
          set -e

          if [ "$cjk_content_rc" -gt 1 ]; then
            echo "::error::the CJK content check could not run (grep exited $cjk_content_rc)" >&2
            exit 1
          fi
          cjk_content_hits=$(printf '%s' "$cjk_content_raw" | grep -v '^site/content/ja/' || true)
          if [ -n "$cjk_content_hits" ]; then
            echo "::error::Non-English (CJK) characters found in an English document. The Japanese edition lives in site/content/ja/." >&2
            printf '%s\n' "$cjk_content_hits" >&2
            exit 1
          fi

          cjk_hits=$(printf '%s' "$cjk_raw" \
            | grep -v '^site/BlazorCodeFirst\.Site/Content/Docs\.g\.cs:' \
            | grep -Fv "$CJK_FIXTURE_FILE:" || true)
          if [ "$cjk_rc" -gt 1 ]; then
            echo "::error::the CJK source check could not run (grep exited $cjk_rc)" >&2
            exit 1
          fi
          if [ -n "$cjk_hits" ]; then
            echo "::error::Non-English (CJK) characters found at the file(s)/line(s) below. Source comments and documentation must be written in English." >&2
            printf '%s\n' "$cjk_hits" >&2
            exit 1
          fi

          # The line above exempts the fixture file's Japanese; this scan holds the rest of it.
          # Removing every double-quoted literal first leaves the comments and the code, so a
          # Japanese comment in that file -- whole-line or trailing -- still fails, and the claim
          # CONTRIBUTING makes about the file is checked rather than asserted. perl for the reason
          # eng/verify-site-prerender.sh gives: it decodes UTF-8 into codepoints, which the CI
          # image's awk does not. No `set +e` dance here -- errexit is back on, so perl dying (a
          # renamed file, say) aborts the step rather than reading as a clean scan.
          cjk_outside_fixtures=$(perl -CSDA -ne \
            's/"(?:\\.|[^"\\])*"//g; print "$ARGV:$.:$_" if /[\x{3040}-\x{30FF}\x{4E00}-\x{9FFF}\x{FF00}-\x{FFEF}]/' \
            "$CJK_FIXTURE_FILE")
          if [ -n "$cjk_outside_fixtures" ]; then
            echo "::error::Non-English (CJK) characters outside a string literal in $CJK_FIXTURE_FILE. Its Japanese is the input under test; its comments must be English." >&2
            printf '%s\n' "$cjk_outside_fixtures" >&2
            exit 1
          fi

          echo "Checking for missing trailing newlines under site/..."
          # Mirrors the root .editorconfig's insert_final_newline = true. Uses `git ls-files` so
          # bin/ and obj/ are excluded automatically (they are gitignored, not build-detected).
          missing=0
          while IFS= read -r -d '' rel; do
            f="site/$rel"
            # Skip binary files (e.g. favicon.png): `file`'s mime-encoding detection is more
            # reliable across grep implementations than a raw NUL-byte scan. Known limitation:
            # `file` reports UTF-16 text without a BOM as "binary" too, so such a file would be
            # silently skipped here. No file under site/ is UTF-16 today (all tracked files are
            # us-ascii, utf-8, or the one genuinely binary favicon.png) -- this does not cover
            # every conceivable text encoding unconditionally.
            if [ "$(file -b --mime-encoding "$f")" = "binary" ]; then
              continue
            fi
            # Command substitution strips all trailing newlines, so a non-empty result here means
            # the file's last byte was not '\n'.
            if [ -s "$f" ] && [ -n "$(tail -c1 "$f")" ]; then
              echo "::error::$f is missing a trailing newline" >&2
              missing=1
            fi
          done < <(git -C site ls-files -z)
          # Must be an if/exit, not `! <command>`: under `set -e` a negated command is exempt from
          # errexit (POSIX), so relying on negation here would silently swallow this failure.
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi

      # The whole-tree backstop for the drift gate at the top of this job. That gate runs
      # `git diff --exit-code` over three named generated files, so a step that writes ANY other
      # tracked path goes unreported. This check is what makes "the job wrote nothing" an assertion
      # rather than an assumption. The publish and deploy jobs run it too, for different writers.
      - name: Verify the job left the working tree clean
        run: bash eng/verify-tree-clean.sh

  # Everything that can fail on the publish OUTPUT, and nothing that reads the source tree beyond
  # compiling it. Its sibling `site-source` is the other half and runs at the same time; see the
  # comment there for why neither waits on the other.
  #
  # The browser suite is not here. It needs this output and nothing else, so it is a third job that
  # takes the artifact this one uploads and shards it -- see `site-browser`.
  site-publish:
    needs: plan
    if: needs.plan.outputs.site == 'true'
    runs-on: ubuntu-latest
    outputs:
      # Read back by the deploy job to prove the artifact round trip dropped nothing. See the
      # assertion there for what that is guarding against.
      published_files: ${{ steps.publish.outputs.files }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish (static, trimmed)
        run: dotnet publish site/BlazorCodeFirst.Site/BlazorCodeFirst.Site.csproj -c Release

      - name: Verify prerendered shell and documents
        run: bash eng/verify-site-prerender.sh site/BlazorCodeFirst.Site/bin/Release/net10.0/publish/wwwroot

      - name: Generate and verify sitemap.xml
        env:
          # Built once by the plan job, from the Worker name and the workers.dev subdomain it also
          # derives the preview URL and the alias length budget from. Nothing in this workflow
          # writes the origin a second time. Through env rather than interpolated into the script,
          # for the reason the target-resolution step gives.
          ORIGIN: ${{ needs.plan.outputs.origin }}
        run: |
          set -euo pipefail
          . eng/ci-assert.sh

          P=site/BlazorCodeFirst.Site/bin/Release/net10.0/publish/wwwroot
          # The same value as an extended regular expression, derived rather than retyped. Needed
          # because the guards below pass patterns to grep -E, where an unescaped "." matches ANY
          # character -- so a typo'd origin like "okXexample" would satisfy a bare "$ORIGIN" pattern.
          ORIGIN_ERE=$(printf '%s' "$ORIGIN" | sed 's/[.[\*^$]/\\&/g')

          # Derived from the publish output rather than from site/content, so the sitemap cannot
          # declare a URL that was not deployed and cannot miss one that was. Every prerendered route
          # is an index.html in its own directory, which makes the mapping mechanical and excludes
          # 404.html without a special case. No lastmod: git does not preserve mtime, so any
          # file-time-derived value would be noise. Trailing-slash form, because that is what
          # Cloudflare's 308 normalizes to and what actually returns 200.
          #
          # That reasoning survives #278 -- where deriving an expectation from the publish output was
          # how a route nothing backed got confirmed rather than caught -- only because
          # eng/verify-site-prerender.sh already ran and proved this same enumeration equals the set
          # site/content backs. A route nothing backs cannot reach this step, so a <loc> for a
          # document nobody wrote cannot either. Keep that script's find expression identical to this
          # one: derived differently, it would pin a set this generator does not read.
          #
          # No XML escaping, deliberately: the only variable segment is a document slug, and
          # site/README.md constrains those to ^[a-z0-9]+(-[a-z0-9]+)*\z -- which DocSlug enforces at
          # build time -- so no character requiring an entity can reach a <loc>. If that rule is ever
          # relaxed, this needs an escape pass for at least "&".
          {
            printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>'
            printf '%s\n' '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
            ( cd "$P" && find . -type f -name index.html -print ) \
              | sed -e 's|^\.||' -e 's|index\.html$||' \
              | LC_ALL=C sort \
              | while IFS= read -r path; do
                  printf '  <url><loc>%s%s</loc></url>\n' "$ORIGIN" "$path"
                done
            printf '%s\n' '</urlset>'
          } > "$P/sitemap.xml"

          echo "--- generated sitemap.xml ---"
          cat "$P/sitemap.xml"

          # Prove the generator actually walked the publish output rather than emitting an empty
          # urlset: these four routes exist in every deployment.
          for path in / /counter/ /docs/ /docs/getting-started/; do
            assert_grep "<loc>$ORIGIN_ERE$path</loc>" "$P/sitemap.xml" "the sitemap is missing a route that the publish output contains"
          done
          assert_not_grep '<loc>[^<]*/404/?</loc>' "$P/sitemap.xml" "the sitemap must not declare the 404 page"
          # Anchored at the start of the extracted <loc> token and requiring a non-slash after the
          # origin's single slash, so this catches an origin typo, http instead of https, AND a
          # doubled slash. An unanchored or unescaped pattern catches only the scheme.
          assert_every_line_matches '<loc>[^<]*</loc>' "^<loc>$ORIGIN_ERE/[^/]" "$P/sitemap.xml" "every sitemap URL must be the production origin followed by exactly one slash"

          # The other half of the public switch, checked here because this is where ORIGIN lives.
          # robots.txt is an ordinary wwwroot file, so neither its disappearance from the publish
          # output nor a regression to the `Disallow: /` it carried while the site was unlisted would
          # fail anything else in this workflow. The Sitemap line is matched against ORIGIN rather
          # than as free text because that origin is now written twice -- here and in the committed
          # file -- and a drift between them publishes a pointer to a sitemap nothing serves.
          assert_file "$P/robots.txt" "the publish output has no robots.txt"
          assert_grep "^Sitemap: $ORIGIN_ERE/sitemap\.xml\$" "$P/robots.txt" "robots.txt does not point at the sitemap this workflow generates"
          # Case-folded because RFC 9309 makes rule names case-insensitive and crawlers honour that,
          # so a lowercase `disallow: /` is a fully effective site-wide block. The helpers always run
          # grep without -i, so the folding has to be in the pattern. Deliberately broad: it forbids
          # ANY Disallow, not just the `/` that this change removes, because an over-broad or
          # mistyped path is the more likely future mistake and is exactly what should be caught. A
          # legitimate per-path Disallow later is not forbidden, only made to cost one edit here.
          assert_not_grep '^[[:space:]]*[Dd][Ii][Ss][Aa][Ll][Ll][Oo][Ww]:' "$P/robots.txt" "robots.txt carries a Disallow rule, and this site is meant to be fully crawlable: preview deployments are deindexed with an X-Robots-Tag header instead, which a Disallow would prevent the crawler from ever reading"

          # The third copy of the origin, and the one that reaches a reader. Every canonical link and
          # og:url in the published HTML is built from SiteMetadata.Origin, and
          # eng/verify-site-prerender.sh reads the origin it compares against back out of robots.txt
          # rather than out of this constant -- so the two drifting apart would leave that script
          # comparing the site against itself and passing on every route. This is the assertion that
          # cannot be made from the publish output, which is why it sits here beside the one above.
          assert_grep "public const string Origin = \"$ORIGIN_ERE\";" \
            site/BlazorCodeFirst.Site/SiteMetadata.cs \
            "SiteMetadata.Origin does not match the origin this workflow deploys to, so every canonical link and og:url in the published HTML names the wrong site"

          # The root of that chain, which the chain itself cannot reach. ORIGIN is built from WORKER,
          # and the step that sets WORKER says it must equal the "name" in site/wrangler.jsonc without
          # checking it. Rename the Worker there and robots.txt, SiteMetadata.Origin and ORIGIN stay in
          # perfect agreement with each other while naming a hostname nothing serves -- every
          # assertion above included. That costs more now than it did before this change, because the
          # origin reaches every page's head rather than only the sitemap.
          worker=${ORIGIN#https://}
          assert_grep "\"name\": \"$(printf '%s' "${worker%%.*}" | sed 's/[.[\*^$]/\\&/g')\"" \
            site/wrangler.jsonc \
            "site/wrangler.jsonc names a different Worker than this workflow derived its origin from, so the deployment would answer on a hostname no published page names"

          # The card every social preview shows. An ordinary wwwroot file, and SiteMetadata.CardPath
          # names it in an absolute URL, so losing it leaves every share falling back to no image with
          # nothing else here noticing.
          assert_file "$P/og.png" "the publish output has no og.png, so every social card falls back to no image"

      - name: Verify the published _headers and the absence of compression sidecars
        run: |
          set -euo pipefail
          . eng/ci-assert.sh

          P=site/BlazorCodeFirst.Site/bin/Release/net10.0/publish/wwwroot

          # The whole of what enforces CompressionEnabled=false (#347). The property is one line in
          # site/BlazorCodeFirst.Site/BlazorCodeFirst.Site.csproj and nothing else would notice it
          # being deleted or an SDK default overriding it: the sidecars are ordinary extra files, so
          # every other check here passes with 124 of them present. Asserting the publish output --
          # rather than keeping the wwwroot/.assetsignore that used to drop them at upload time --
          # is what makes that regression a red run instead of a silent four seconds a run.
          #
          # Recursive: sidecars appear under _framework/ as well as at the root, so the
          # -maxdepth 1 assert_no_glob cannot see most of them.
          assert_no_glob_recursive "$P" '*.br' "the publish output carries Brotli sidecars, so CompressionEnabled is no longer false"
          assert_no_glob_recursive "$P" '*.gz' "the publish output carries gzip sidecars, so CompressionEnabled is no longer false"

          # _headers is an ordinary wwwroot file, so if it ever stopped being published NOTHING else
          # in this workflow would fail -- and the preview injection in the deploy job appends with
          # ">>", which would create a fresh file and succeed, deploying a _headers that has only the
          # noindex rule and no immutable cache rule. Asserting the contents BEFORE any injection
          # catches file loss, rule loss, and a mis-ordered workflow with one check.
          assert_file "$P/_headers" "the publish output has no _headers file"
          assert_grep '^/_framework/\*$' "$P/_headers" "the /_framework/* rule is missing from _headers"
          # Losing this rule breaks nothing a reader would see: the fonts still arrive, just on every
          # visit instead of once a year. No other check here or in the browser suite reads a response
          # header, so nothing else would notice.
          assert_grep '^/fonts/\*$' "$P/_headers" "the /fonts/* rule is missing from _headers, so every self-hosted font is refetched on every visit"
          # Counted, not matched. Two rules freeze a path and their directive lines are identical, so
          # a presence check passes while EITHER rule is intact and cannot tell which one is. The
          # count fails in both directions: below two, a frozen path lost its directive; above two, a
          # third path was frozen without this assertion being revisited, which matters because
          # freezing a URL for a year is only safe where the name changes with the contents.
          assert_count '^  Cache-Control: public, max-age=31536000, immutable$' "$P/_headers" 2 "_headers must carry exactly two immutable cache directives, one under /_framework/* and one under /fonts/*"
          assert_grep '^/404$' "$P/_headers" "the /404 rule is missing from _headers"
          assert_grep '^  X-Robots-Tag: noindex$' "$P/_headers" "the /404 noindex directive is missing from _headers"
          # _headers is the third way to deindex production, and the only one the two guards added
          # with the public switch do not cover: adding a "/*" X-Robots-Tag rule to the COMMITTED
          # file would deindex every page while satisfying every presence assertion here. Counting
          # instead of matching is what closes that, and this step is the right home for it because
          # it runs on production and preview alike -- the deploy job's post-injection assertions
          # cannot do this job, since by then a second rule is legitimately present on previews.
          #
          # Anchored to rule lines: the file explains this rule in prose, so an unanchored
          # 'X-Robots-Tag' counts the comment mentions too and can never equal 1.
          assert_count '^[[:space:]]*X-Robots-Tag:' "$P/_headers" 1 "the committed _headers must declare exactly one X-Robots-Tag rule (the /404 one); a second rule would deindex production"

      # The whole-tree backstop for this job: `dotnet publish` and the sitemap step write into the
      # gitignored publish directory and nothing else, and this is what makes that an assertion
      # rather than an assumption. The source and deploy jobs run it too, for different writers.
      - name: Verify the job left the working tree clean
        run: bash eng/verify-tree-clean.sh

      # Last, so a failure above is reported by the step that found it rather than by a missing
      # artifact in a later job. The publish output is 5.8MB in 69 files, so the round trip costs
      # seconds against the two minutes a second publish in each consumer would take.
      #
      # PRE-injection, deliberately: the preview noindex rule is appended to _headers in the deploy
      # job, so the artifact holds the file exactly as the assertions above saw it.
      - name: Count the publish output
        id: publish
        run: |
          set -euo pipefail
          P=site/BlazorCodeFirst.Site/bin/Release/net10.0/publish/wwwroot
          echo "files=$(find "$P" -type f | wc -l | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Upload the publish output
        uses: actions/upload-artifact@v7
        with:
          name: site-publish
          path: site/BlazorCodeFirst.Site/bin/Release/net10.0/publish/wwwroot
          # No include-hidden-files. There is no hidden file in the publish output since
          # wwwroot/.assetsignore was deleted with the sidecars (#347), and upload-artifact drops
          # hidden files with a warning rather than an error -- so a future one would go missing
          # quietly. The file count the deploy job compares is what would catch that.
          if-no-files-found: error

  # `site-publish` asserts the publish output as text, which can prove the shell rendered and the
  # stylesheet links survived and cannot see anything the browser computes. This job is that half:
  # overflow, whether a clickable label fits, WCAG contrast, and where the documentation rail lands
  # (#251). It runs before the deploy rather than after it, so a failure stops the bad deployment
  # rather than describing it afterwards.
  #
  # Against the publish output `site-publish` built, not a deployment. Hydration behaviour and
  # Cloudflare's edge routing genuinely need one, and are `site-smoke`'s subject below; none of these
  # checks needs anything but the files and a static server.
  #
  # Sharded, because this is the longest thing in the workflow by a wide margin: 302 tests, each
  # opening a page and waiting out the WebAssembly boot. Over the last 19 green runs of the job it
  # used to sit in, it averaged 133s of that job's 267s and reached 187s of 331s at the worst, on
  # one four-core runner. Playwright splits by test rather than by file, and the suite already
  # declares fullyParallel, so a shard is an ordinary subset and no spec needs to know it is being
  # split. Three of them: the per-shard cost that does not divide, meaning runner startup, the
  # checkout, node, and the browser download, is about 30s, so a fourth shard would buy less than it
  # spends.
  #
  # Not joined to the browser job in ci.yml, which measures Blazor's JS renderer against a live host
  # and shares no input with this one, and not named `browser` either: that name is a required check
  # there, and two checks answering to one name is how a ruleset stops meaning what it says.
  site-browser:
    needs: [plan, site-publish]
    if: needs.plan.outputs.site == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      # For the specs, and for site/content: the suite reads the document tree to decide which
      # routes are documents and which are translation indexes. site-pages.ts says why that side
      # cannot come from the publish output.
      - uses: actions/checkout@v7

      # Restored to the path site-pages.ts resolves `publishRoot` against, which serve.mjs is then
      # pointed at. The suite starts its own static server over these files; nothing here rebuilds
      # them.
      - uses: actions/download-artifact@v8
        with:
          name: site-publish
          path: site/BlazorCodeFirst.Site/bin/Release/net10.0/publish/wwwroot

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/tests/browser/package-lock.json

      - run: npm ci
        working-directory: site/tests/browser

      # Playwright's loader transpiles the specs and throws their types away, so a type error here
      # runs green and shows up only as noise in a contributor's editor (#254). This is the only
      # thing in the repository that reads them. It runs before the browser download because it
      # takes seconds and needs nothing but node_modules. Every shard runs it: it costs about a
      # second, and making one shard special would leave the check gone whenever that shard is the
      # one that fails early.
      - run: npx tsc --noEmit
        working-directory: site/tests/browser

      # package-lock.json pins playwright-core exactly, and the browser revision is a function of
      # that version, so its hash is the right key for the downloaded browser.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('site/tests/browser/package-lock.json') }}

      - run: npx playwright install --with-deps chromium
        working-directory: site/tests/browser

      # The shard count is `strategy.job-total`, not a literal repeated from the matrix above:
      # a `--shard=n/3` written by hand goes wrong silently when the matrix grows, running three
      # shards' worth of tests across four jobs and skipping the last third entirely.
      - name: Verify the published site in a browser
        id: browser
        run: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        working-directory: site/tests/browser

      # Conditioned on this step rather than on the job, so an earlier failure does not reach for a
      # directory that was never written. The name carries the shard because upload-artifact rejects
      # a second upload under a name already taken, which two failing shards would otherwise do.
      - if: failure() && steps.browser.conclusion == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: site-playwright-traces-${{ matrix.shard }}
          path: site/tests/browser/test-results

  # Cloudflare, and nothing that could fail on the source. Split from the verification (#250) so the
  # required check does not depend on a third party being up, and so a deploy that fails leaves the
  # merge decision alone.
  deploy:
    needs: [plan, site-source, site-publish, site-browser]
    # A pull_request from a fork gets no secrets, so the deploy would FAIL rather than skip. Test the
    # head repository explicitly instead of probing for an empty secret.
    #
    # Dependabot needs its own test. Its branches live in this repository, so they pass the fork
    # check, but a Dependabot-triggered run reads the Dependabot secret store rather than the Actions
    # one and would reach wrangler with an empty apiToken. Dependabot touches site/ because the four
    # projects there hold inline package versions, so this fires often. A dependency bump has no use
    # for a preview URL; the verification above still runs.
    #
    # This condition names no status function, so the implicit requirement that `needs` succeeded
    # still applies: any of the three verification jobs failing or skipping skips this one. All
    # three are listed rather than just the one that produces the artifact, so a layout regression
    # or a formatting drift stops the deployment instead of being described after it.
    if: >-
      github.actor != 'dependabot[bot]'
      && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Commenting the preview URL needs it. Without an explicit block the job inherits the
      # repository default, which is read-only on many repositories and would 403 at comment time.
      pull-requests: write
    steps:
      # For site/wrangler.jsonc and eng/ci-assert.sh. The publish output is not rebuilt here; it
      # arrives as the artifact site-publish uploaded.
      - uses: actions/checkout@v7

      # Restored to the path site/wrangler.jsonc resolves its assets directory against, which is
      # relative to that file rather than to any working directory.
      - uses: actions/download-artifact@v8
        with:
          name: site-publish
          path: site/BlazorCodeFirst.Site/bin/Release/net10.0/publish/wwwroot

      - name: Verify the restored publish output
        env:
          EXPECTED: ${{ needs['site-publish'].outputs.published_files }}
        run: |
          set -euo pipefail
          . eng/ci-assert.sh

          P=site/BlazorCodeFirst.Site/bin/Release/net10.0/publish/wwwroot

          # What is deployed is now a COPY of what was verified, which is a way for files to go
          # missing that did not exist while one job did both. A count comparison catches the whole
          # class -- a hidden file dropped by upload-artifact, a partial download, a path typo above
          # -- where naming a few files by hand would only catch the ones someone thought of.
          actual=$(find "$P" -type f | wc -l | tr -d '[:space:]')
          if [ "$actual" != "$EXPECTED" ]; then
            echo "::error::the publish output that arrived here has $actual files and the verified one had $EXPECTED, so this deployment would not be what was verified" >&2
            exit 1
          fi

          # The two files nothing else here would miss, named anyway because they are the ones whose
          # loss is silent at the edge rather than obvious: a missing _headers deploys an uncached,
          # indexable site, and a missing sitemap.xml leaves robots.txt pointing at a 404.
          assert_file "$P/_headers" "the restored publish output has no _headers file"
          assert_file "$P/sitemap.xml" "the restored publish output has no sitemap.xml"

      - name: Inject the preview noindex header
        if: needs.plan.outputs.environment == 'preview'
        run: |
          set -euo pipefail
          . eng/ci-assert.sh

          P=site/BlazorCodeFirst.Site/bin/Release/net10.0/publish/wwwroot

          # This rule is a hedge, not what actually deindexes a preview. Cloudflare documents no
          # default for Workers preview URLs, but measured on pr-340 they carry their own
          # X-Robots-Tag: noindex, and that value REPLACES what _headers sets for the same header
          # name: every preview path answered `noindex` rather than the `noindex, nofollow` written
          # below, while the same deployment's Cache-Control rules from _headers arrived intact.
          # So the `nofollow` does not reach a response today, and the rule earns its place only by
          # covering an undocumented default that could change.
          #
          # X-Robots-Tag only. robots.txt is deliberately NOT touched: "Disallow: /" stops the crawl,
          # so the crawler never reads the noindex and the two directives CANCEL rather than add.
          # The leading blank line keeps this a separate rule from the last one in the committed file.
          printf '\n/*\n  X-Robots-Tag: noindex, nofollow\n' >> "$P/_headers"

          assert_grep '^/\*$' "$P/_headers" "the injected preview rule has no /* path line"
          assert_grep '^  X-Robots-Tag: noindex, nofollow$' "$P/_headers" "the injected preview noindex directive is missing"

          # Re-assert the /_framework/* rule survived the append above. The verify job already proved
          # the rule was present before the append; the only thing left to prove is that ">>" stayed
          # ">>" -- a future edit turning it into ">" would truncate the file to just the preview rule
          # while leaving the two assertions above (which only look at what THIS step just wrote)
          # passing.
          assert_grep '^/_framework/\*$' "$P/_headers" "the /_framework/* rule did not survive the preview append -- _headers was truncated instead of extended"
          assert_grep '^  Cache-Control: public, max-age=31536000, immutable$' "$P/_headers" "the immutable cache directive did not survive the preview append -- _headers was truncated instead of extended"

          echo "--- published _headers ---"
          cat "$P/_headers"

      # wrangler-action runs `npm i wrangler@4` in its workingDirectory whenever it does not already
      # find wrangler there, and that writes package.json and package-lock.json. At the default
      # working directory -- the repository root -- neither file is tracked and neither is ignored, so
      # the last step in this job would report the tree dirty and fail. Being ignored is what fixes
      # that: the `git status --porcelain` it runs carries no pathspec and reports the whole
      # repository no matter where the install happened.
      #
      # The package.json is written here rather than left to `npm i`, which resolves its install
      # prefix by walking up from the working directory until it finds a package.json or a
      # node_modules. Writing one pins the prefix to this directory instead of leaving it to whatever
      # happens to sit above the checkout on the runner.
      - name: Prepare the wrangler install root
        run: |
          set -euo pipefail
          mkdir -p .wrangler-ci
          printf '%s\n' '{ "private": true }' > .wrangler-ci/package.json

      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # See the step above for why the install root is moved off the repository root.
          workingDirectory: .wrangler-ci
          # `deploy` or `versions upload --preview-alias`, decided by the plan job rather than here
          # (see that job). --config is written here, next to the workingDirectory that forces it to
          # be absolute; everything else wrangler needs is inside that file, including the assets
          # directory, which wrangler resolves against the configuration file rather than against
          # this workingDirectory.
          command: ${{ needs.plan.outputs.command }} --config ${{ github.workspace }}/site/wrangler.jsonc

      - name: Comment the preview URL on the pull request
        # The fork and Dependabot conditions are on the job. What is left is that only a pull request
        # has somewhere to post: a push and a workflow_dispatch both deploy and neither has a
        # comment thread.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          URL: ${{ needs.plan.outputs.preview_url }}
        run: |
          set -euo pipefail

          # The alias URL is BUILT by the plan job, not read back from wrangler. wrangler-action does
          # set deployment-url for `versions upload`, but from an optional preview_url field that is
          # not documented to carry the alias rather than the version-prefixed URL, and a URL that
          # changes on every push is exactly what setting an alias exists to avoid. Nothing here
          # re-tests that the upload happened: wrangler-action fails the job when wrangler exits
          # non-zero, so this step only runs after it succeeded.
          url="$URL"

          # Says noindex, not the "noindex, nofollow" the injection step writes. See that step for
          # why the two differ.
          body=$(printf 'Preview deploy: %s\n\nServed with `X-Robots-Tag: noindex`.\n' "$url")

          # Edit the bot's previous comment instead of stacking one per push. The `||` fallback covers
          # a gh build without --create-if-none.
          gh pr comment "$PR_NUMBER" --body "$body" --edit-last --create-if-none \
            || gh pr comment "$PR_NUMBER" --body "$body"

      # A canary, not a gate. The deploy is two steps behind by now, so this cannot stop a deployment
      # built from a tree that was written to, only report that one happened. What it catches is a
      # wrangler-action release that installs somewhere other than the root prepared for it, or a new
      # step that writes into the checkout. Either would otherwise surface as one warning line in the
      # middle of a long green log, which is how #282 went unnoticed for as long as it did.
      #
      # Last rather than immediately after the deploy, so that a dirty tree still gets its preview
      # URL commented; the step between them only calls `gh` and cannot dirty anything.
      - name: Verify the job left the working tree clean
        run: bash eng/verify-tree-clean.sh

  # A canary on the deployment `deploy` just produced, not a gate (#47). `site-verified` below does
  # not `need` this job and reports without it, for the same reason it does not need `deploy` either
  # (#250): a check that depends on Cloudflare being reachable and correct must not be able to block
  # a merge, or an edge outage becomes a repository outage. On a pull request a red run here is
  # informational; on main it is the first thing to notice a deployment that built and uploaded clean
  # but broke once a browser actually ran it.
  #
  # `needs: deploy` rather than repeating deploy's own `if`: a skipped `deploy` (a fork pull request,
  # or Dependabot) skips this job for free, and there is nothing here to check without a deployment
  # to point a browser at.
  #
  # Everything `site-publish` and `site-browser` check is provable from the publish output and a
  # static server; nothing here needs either. What only a live deployment can show is hydration
  # behaviour and Cloudflare's edge routing -- the `smoke/` suite's own config explains why in detail.
  site-smoke:
    needs: [plan, deploy]
    if: needs.plan.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      # For the smoke specs and site/content, which they read routes from the same way the sibling
      # suite's specs read the publish output -- see smoke/deployed.ts.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/tests/browser/package-lock.json

      - run: npm ci
        working-directory: site/tests/browser

      # package-lock.json pins playwright-core exactly, and the browser revision is a function of
      # that version -- the same cache key the sibling job uses, and the same reason.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('site/tests/browser/package-lock.json') }}

      - run: npx playwright install --with-deps chromium
        working-directory: site/tests/browser

      - name: Smoke-test the deployment
        id: smoke
        env:
          BCF_SITE_BASE_URL: ${{ needs.plan.outputs.deployed_url }}
        run: npx playwright test --config=smoke/playwright.smoke.config.ts
        working-directory: site/tests/browser

      # Distinct name from the sibling job's, which upload-artifact would otherwise reject as already
      # taken if both failed in the same run.
      - if: failure() && steps.smoke.conclusion == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: site-smoke-playwright-traces
          path: site/tests/browser/test-results

  # The required check on main, and the only job here that runs on every pull request (#250).
  #
  # Its whole contract is that its name is what the repository ruleset asks for and that it reports
  # what the verification did. That is worth a job because the alternative shapes are worse: a
  # `paths:` filter leaves the check pending forever on an unrelated pull request, and dropping the
  # filter to run the verification unconditionally spends minutes re-verifying a publish output that
  # is byte-identical to main's whenever the site's inputs did not change.
  #
  # `!cancelled()` rather than `always()`: a run superseded by the concurrency group has nothing to
  # report, and reporting it red would be noise on top of a cancellation. Every other outcome,
  # including a skipped verification, reaches the script below.
  site-verified:
    needs: [plan, site-source, site-publish, site-browser]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Report whether the site was verified
        env:
          PLAN: ${{ needs.plan.result }}
          SITE: ${{ needs.plan.outputs.site }}
          # One variable per verification job, and each is tested by name below rather than folded
          # into a single "did everything pass". A required check that says only "the verification
          # did not succeed" makes the reader open three job logs to find out which; naming the job
          # costs three lines here and answers it from the check itself.
          SOURCE: ${{ needs['site-source'].result }}
          PUBLISH: ${{ needs['site-publish'].result }}
          BROWSER: ${{ needs['site-browser'].result }}
        run: |
          set -euo pipefail

          # A plan job that did not succeed leaves "was there anything to verify" unanswered, and the
          # honest answer to an unanswered question is to block. Green here would be the one failure
          # mode this whole arrangement exists to avoid: a required check that passes without
          # anything having been checked.
          if [ "$PLAN" != success ]; then
            echo "::error::the plan job did not succeed ($PLAN), so whether this run had anything to verify is unknown" >&2
            exit 1
          fi

          if [ "$SITE" != true ]; then
            echo "Nothing under the site's inputs changed, so this pull request cannot break the site."
            exit 0
          fi

          failed=0
          if [ "$SOURCE" != success ]; then
            echo "::error::the source-tree checks did not succeed ($SOURCE)" >&2
            failed=1
          fi
          if [ "$PUBLISH" != success ]; then
            echo "::error::the publish-output checks did not succeed ($PUBLISH)" >&2
            failed=1
          fi
          # A matrix job's result is the worst of its shards, so one failing shard reports here.
          if [ "$BROWSER" != success ]; then
            echo "::error::the browser suite did not succeed ($BROWSER)" >&2
            failed=1
          fi
          # Every job is reported before the exit, rather than the first one found: three jobs run
          # at once and more than one can fail in the same run, and stopping at the first would send
          # the reader back for a second round trip to learn about the others.
          if [ "$failed" -eq 1 ]; then
            exit 1
          fi

          echo "The site verification passed."
