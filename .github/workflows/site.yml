name: site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "src/**"
      - "eng/ci-assert.sh"
      - "eng/verify-site-prerender.sh"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "src/**"
      - "eng/ci-assert.sh"
      - "eng/verify-site-prerender.sh"
      - ".github/workflows/site.yml"
  workflow_dispatch:

# Commenting the preview URL needs pull-requests: write. Without an explicit block the job inherits
# the repository default, which is read-only on many repositories and would 403 at comment time.
permissions:
  contents: read
  pull-requests: write

concurrency:
  # github.ref is refs/pull/<number>/merge on a pull_request, so each PR gets its own group and
  # supersedes only itself.
  group: site-${{ github.ref }}
  # Never cancel an in-flight PRODUCTION deploy. `wrangler deploy` uploads a version and then points
  # the deployment at it, so a cancelled run cannot leave the live site in a partial state the way an
  # interrupted incremental upload could -- but it can end with no record of whether the version was
  # created, on the one ref where that question is expensive to answer. This keys on the REF rather
  # than on the production/preview decision, so a workflow_dispatch from main (a preview, see the
  # target-resolution step below) is also protected from cancellation -- the safe direction.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the deployment target
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # Derive the preview alias from the production/preview decision rather than passing
          # github.ref_name straight through. Two ways that went wrong:
          #   * workflow_dispatch from main handed wrangler "main", i.e. a PRODUCTION deploy, while
          #     the noindex logic below treats any non-push run as a preview -- deindexing the live
          #     site.
          #   * On pull_request, github.ref_name is "<number>/merge", which is not a usable alias
          #     at all.
          # Context values arrive through env, not GitHub Actions expression interpolation directly
          # into the script, so a branch name cannot inject shell.
          #
          # A consequence of this decision: workflow_dispatch can no longer produce a production
          # deploy, from any ref including main; it always deploys to a "dispatch-<branch>" preview.
          # To redeploy production without a new commit, re-run the push workflow run instead:
          # `gh run rerun <run-id>`.
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "main" ]; then
            environment=production
            alias=
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            environment=preview
            alias="pr-$PR_NUMBER"
          else
            # A dispatch on a branch whose name contains "/" would not survive in a hostname, so
            # flatten the separator.
            environment=preview
            alias="dispatch-${REF_NAME//\//-}"
          fi

          # A preview is served at "<alias>-blazor-code-first-site.<subdomain>.workers.dev", and a
          # DNS label may not exceed 63 characters. The Worker name takes 22 of them plus the
          # separator, so anything past 40 is truncated here rather than left to fail at deploy
          # time. "pr-<N>" cannot reach that; a dispatch from a long branch name can.
          if [ "${#alias}" -gt 40 ]; then
            alias="${alias:0:40}"
          fi
          # Truncation can leave a trailing "-", which is not a legal way for a DNS label to end.
          alias="${alias%-}"

          # wrangler-action takes exactly one command, so the production/preview split is made here
          # rather than by duplicating the deploy step behind two `if:` conditions. `versions
          # upload` creates a version WITHOUT moving the production deployment onto it, so a
          # preview has no path to production even if this decision were wrong.
          #
          # The Worker has to EXIST before a preview can be uploaded for it: Cloudflare documents
          # that `versions upload` fails on a Worker that has never been deployed. Recreating this
          # deployment from nothing therefore starts with one `wrangler deploy`, from a machine or
          # from a push to main, and only then can a pull request produce a preview.
          config="$GITHUB_WORKSPACE/site/wrangler.jsonc"
          if [ "$environment" = production ]; then
            command="deploy --config $config"
          else
            command="versions upload --config $config --preview-alias $alias"
          fi

          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "alias=$alias" >> "$GITHUB_OUTPUT"
          echo "command=$command" >> "$GITHUB_OUTPUT"
          echo "Deploying as $environment with: wrangler $command"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Snippets.g.cs is gated the same way as the two document artifacts, and for one more reason.
      # A snippet may read a file that is also compiled -- /counter's figure is Pages/CounterPage.cs
      # -- so this diff is what stops a figure from falling behind the source it claims to show.
      - name: Regenerate docs and snippets, and verify freshness
        run: |
          dotnet run --project site/tools/BlazorCodeFirst.Site.DocGen.Cli/BlazorCodeFirst.Site.DocGen.Cli.csproj -- \
            site/content \
            site/BlazorCodeFirst.Site/Content/Docs.g.cs \
            site/BlazorCodeFirst.Site/wwwroot/css/highlight.css \
            site/snippets \
            site/BlazorCodeFirst.Site/Content/Snippets.g.cs
          git diff --exit-code -- \
            site/BlazorCodeFirst.Site/Content/Docs.g.cs \
            site/BlazorCodeFirst.Site/wwwroot/css/highlight.css \
            site/BlazorCodeFirst.Site/Content/Snippets.g.cs

      - name: DocGen unit tests
        run: dotnet test site/tools/BlazorCodeFirst.Site.DocGen.Tests/BlazorCodeFirst.Site.DocGen.Tests.csproj

      # site/ sits outside BlazorCodeFirst.slnx, so it is outside the repository's main
      # `dotnet format` gate (see CONTRIBUTING.md, "Code style"). This step closes that gap for
      # the site projects.
      # `dotnet format` requires a restored project; restore is left implicit here (no
      # --no-restore) rather than adding a separate restore step, since each `dotnet format`
      # invocation below already restores its own project on demand.
      - name: Format check (site/)
        run: |
          # Build the site app before formatting it. `dotnet format` loads each project as a Roslyn
          # workspace and compiles it, and the app's RenderView comes from the BlazorCodeFirst source
          # generator referenced as an analyzer ProjectReference. On a cold checkout that generator
          # assembly does not exist yet, so the workspace load reports CS0534 ("does not implement
          # inherited abstract member RenderView") for every compose component and the step fails.
          # Building first produces the generator; the DocGen projects need no such step.
          dotnet build site/BlazorCodeFirst.Site/BlazorCodeFirst.Site.csproj
          dotnet format site/BlazorCodeFirst.Site/BlazorCodeFirst.Site.csproj --verify-no-changes
          dotnet format site/tools/BlazorCodeFirst.Site.DocGen/BlazorCodeFirst.Site.DocGen.csproj --verify-no-changes
          dotnet format site/tools/BlazorCodeFirst.Site.DocGen.Cli/BlazorCodeFirst.Site.DocGen.Cli.csproj --verify-no-changes
          dotnet format site/tools/BlazorCodeFirst.Site.DocGen.Tests/BlazorCodeFirst.Site.DocGen.Tests.csproj --verify-no-changes

      - name: Verify site source hygiene
        run: |
          set -euo pipefail

          # Mechanical guards for issues that slipped past human review on an earlier branch: 21 Japanese
          # trailing comments in two committed test files were caught only by a whole-branch
          # review at the very end, and nothing here caught CRLF/missing-newline drift either.
          #
          # This step does not source eng/ci-assert.sh even though it hand-rolls the same two
          # shell hazards that library exists to contain (see below). Its helpers all take a
          # single file plus an ERE, but neither check here fits that shape: the CJK scan is a
          # recursive `grep -rnP` over a directory tree, and the newline check walks a
          # `git ls-files` loop rather than testing one path. Reusing the library would mean
          # restructuring both checks around it rather than just calling it.

          echo "Checking for non-English (CJK) characters in site source and English content..."
          # Hiragana, katakana, CJK ideographs, and fullwidth forms. Deliberately excludes the
          # em dash (U+2014), which appears legitimately in existing English comments.
          #
          # The scan covers *.cs and *.razor, and now the English documents as well. It used to
          # stop at source, so Japanese in an English site/content/*.md went unnoticed: the rule
          # existed but could not bite where the prose actually is. Extending it here is what makes
          # site/content/ja/ a carved-out exception rather than the first place anyone noticed the
          # rule was unenforced.
          #
          # Two paths are excluded, for different reasons:
          #   * site/content/ja/ is the exception itself, named in CONTRIBUTING.
          #   * Docs.g.cs is generated FROM that directory. It is not a second exception; it is the
          #     same content after conversion, and scanning it would fail the build for the file
          #     doing its job. Nothing else generated carries prose, so the exclusion is by name
          #     rather than by a pattern that might quietly widen.
          #
          # grep exits 1 for "no match" and 2 for an error (for example a grep built without
          # PCRE, which rejects -P). An `if grep ...; then` guard treats both exit codes as
          # "clean", so a broken/unavailable -P support would make this check silently pass
          # forever -- the same class of defect as the negated-grep bug already fixed for this
          # same check. Capture the output and exit code separately so a check-level failure
          # (rc=2) is reported distinctly from a genuinely clean result (rc=1, no hits).
          #
          # --exclude-dir prunes by directory NAME at any depth, so it cannot express "the ja
          # directly under site/content". Each scan therefore drops its exempt paths afterwards,
          # with an anchored grep -v, so a future site/tools/ja/ would still be scanned.
          #
          # The exempt paths are dropped AFTER the exit code is captured, never through a pipe into
          # the same assignment. `hits=$(grep ... | grep -v ...)` reports the LAST command's status,
          # and a first grep that died with rc=2 produces no output, which the filter answers with
          # rc=1 -- indistinguishable from a clean scan. That is the silent-pass defect this check
          # has already been fixed for once.
          CJK_RANGE='[\x{3040}-\x{30FF}\x{4E00}-\x{9FFF}\x{FF00}-\x{FFEF}]'

          set +e
          cjk_raw=$(grep -rnP --include='*.cs' --include='*.razor' --exclude-dir=bin --exclude-dir=obj \
              "$CJK_RANGE" site/)
          cjk_rc=$?
          # Both content file kinds: the documents, and the shell.yml each language declares its
          # non-document strings in. Scanning only *.md would leave the English shell text as the one
          # reader-facing file nothing checks.
          cjk_content_raw=$(grep -rnP --include='*.md' --include='*.yml' "$CJK_RANGE" site/content/)
          cjk_content_rc=$?
          set -e

          if [ "$cjk_content_rc" -gt 1 ]; then
            echo "::error::the CJK content check could not run (grep exited $cjk_content_rc)" >&2
            exit 1
          fi
          cjk_content_hits=$(printf '%s' "$cjk_content_raw" | grep -v '^site/content/ja/' || true)
          if [ -n "$cjk_content_hits" ]; then
            echo "::error::Non-English (CJK) characters found in an English document. The Japanese edition lives in site/content/ja/." >&2
            printf '%s\n' "$cjk_content_hits" >&2
            exit 1
          fi

          cjk_hits=$(printf '%s' "$cjk_raw" | grep -v '^site/BlazorCodeFirst\.Site/Content/Docs\.g\.cs:' || true)
          if [ "$cjk_rc" -gt 1 ]; then
            echo "::error::the CJK source check could not run (grep exited $cjk_rc)" >&2
            exit 1
          fi
          if [ -n "$cjk_hits" ]; then
            echo "::error::Non-English (CJK) characters found at the file(s)/line(s) below. Source comments and documentation must be written in English." >&2
            printf '%s\n' "$cjk_hits" >&2
            exit 1
          fi

          echo "Checking for missing trailing newlines under site/..."
          # Mirrors the root .editorconfig's insert_final_newline = true. Uses `git ls-files` so
          # bin/ and obj/ are excluded automatically (they are gitignored, not build-detected).
          missing=0
          while IFS= read -r -d '' rel; do
            f="site/$rel"
            # Skip binary files (e.g. favicon.png): `file`'s mime-encoding detection is more
            # reliable across grep implementations than a raw NUL-byte scan. Known limitation:
            # `file` reports UTF-16 text without a BOM as "binary" too, so such a file would be
            # silently skipped here. No file under site/ is UTF-16 today (all tracked files are
            # us-ascii, utf-8, or the one genuinely binary favicon.png) -- this does not cover
            # every conceivable text encoding unconditionally.
            if [ "$(file -b --mime-encoding "$f")" = "binary" ]; then
              continue
            fi
            # Command substitution strips all trailing newlines, so a non-empty result here means
            # the file's last byte was not '\n'.
            if [ -s "$f" ] && [ -n "$(tail -c1 "$f")" ]; then
              echo "::error::$f is missing a trailing newline" >&2
              missing=1
            fi
          done < <(git -C site ls-files -z)
          # Must be an if/exit, not `! <command>`: under `set -e` a negated command is exempt from
          # errexit (POSIX), so relying on negation here would silently swallow this failure.
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi

      - name: Publish (static, trimmed)
        run: dotnet publish site/BlazorCodeFirst.Site/BlazorCodeFirst.Site.csproj -c Release

      - name: Verify prerendered shell and documents
        run: bash eng/verify-site-prerender.sh site/BlazorCodeFirst.Site/bin/Release/net10.0/publish/wwwroot

      - name: Generate and verify sitemap.xml
        run: |
          set -euo pipefail
          . eng/ci-assert.sh

          P=site/BlazorCodeFirst.Site/bin/Release/net10.0/publish/wwwroot
          # The one place the production origin is written in this workflow.
          ORIGIN=https://blazor-code-first-site.snsgr.workers.dev
          # The same value as an extended regular expression, derived rather than retyped. Needed
          # because the guards below pass patterns to grep -E, where an unescaped "." matches ANY
          # character -- so a typo'd origin like "okXexample" would satisfy a bare "$ORIGIN" pattern.
          ORIGIN_ERE=$(printf '%s' "$ORIGIN" | sed 's/[.[\*^$]/\\&/g')

          # Derived from the publish output rather than from site/content, so the sitemap cannot
          # declare a URL that was not deployed and cannot miss one that was. Every prerendered route
          # is an index.html in its own directory, which makes the mapping mechanical and excludes
          # 404.html without a special case. No lastmod: git does not preserve mtime, so any
          # file-time-derived value would be noise. Trailing-slash form, because that is what
          # Cloudflare's 308 normalizes to and what actually returns 200.
          #
          # That reasoning survives #278 -- where deriving an expectation from the publish output was
          # how a route nothing backed got confirmed rather than caught -- only because
          # eng/verify-site-prerender.sh already ran and proved this same enumeration equals the set
          # site/content backs. A route nothing backs cannot reach this step, so a <loc> for a
          # document nobody wrote cannot either. Keep that script's find expression identical to this
          # one: derived differently, it would pin a set this generator does not read.
          #
          # No XML escaping, deliberately: the only variable segment is a document slug, and
          # site/README.md constrains those to ^[a-z0-9]+(-[a-z0-9]+)*\z -- which DocSlug enforces at
          # build time -- so no character requiring an entity can reach a <loc>. If that rule is ever
          # relaxed, this needs an escape pass for at least "&".
          {
            printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>'
            printf '%s\n' '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
            ( cd "$P" && find . -type f -name index.html -print ) \
              | sed -e 's|^\.||' -e 's|index\.html$||' \
              | LC_ALL=C sort \
              | while IFS= read -r path; do
                  printf '  <url><loc>%s%s</loc></url>\n' "$ORIGIN" "$path"
                done
            printf '%s\n' '</urlset>'
          } > "$P/sitemap.xml"

          echo "--- generated sitemap.xml ---"
          cat "$P/sitemap.xml"

          # Prove the generator actually walked the publish output rather than emitting an empty
          # urlset: these four routes exist in every deployment.
          for path in / /counter/ /docs/ /docs/getting-started/; do
            assert_grep "<loc>$ORIGIN_ERE$path</loc>" "$P/sitemap.xml" "the sitemap is missing a route that the publish output contains"
          done
          assert_not_grep '<loc>[^<]*/404/?</loc>' "$P/sitemap.xml" "the sitemap must not declare the 404 page"
          # Anchored at the start of the extracted <loc> token and requiring a non-slash after the
          # origin's single slash, so this catches an origin typo, http instead of https, AND a
          # doubled slash. An unanchored or unescaped pattern catches only the scheme.
          assert_every_line_matches '<loc>[^<]*</loc>' "^<loc>$ORIGIN_ERE/[^/]" "$P/sitemap.xml" "every sitemap URL must be the production origin followed by exactly one slash"

          # The other half of the public switch, checked here because this is where ORIGIN lives.
          # robots.txt is an ordinary wwwroot file, so neither its disappearance from the publish
          # output nor a regression to the `Disallow: /` it carried while the site was unlisted would
          # fail anything else in this workflow. The Sitemap line is matched against ORIGIN rather
          # than as free text because that origin is now written twice -- here and in the committed
          # file -- and a drift between them publishes a pointer to a sitemap nothing serves.
          assert_file "$P/robots.txt" "the publish output has no robots.txt"
          assert_grep "^Sitemap: $ORIGIN_ERE/sitemap\.xml\$" "$P/robots.txt" "robots.txt does not point at the sitemap this workflow generates"
          # Case-folded because RFC 9309 makes rule names case-insensitive and crawlers honour that,
          # so a lowercase `disallow: /` is a fully effective site-wide block. The helpers always run
          # grep without -i, so the folding has to be in the pattern. Deliberately broad: it forbids
          # ANY Disallow, not just the `/` that this change removes, because an over-broad or
          # mistyped path is the more likely future mistake and is exactly what should be caught. A
          # legitimate per-path Disallow later is not forbidden, only made to cost one edit here.
          assert_not_grep '^[[:space:]]*[Dd][Ii][Ss][Aa][Ll][Ll][Oo][Ww]:' "$P/robots.txt" "robots.txt carries a Disallow rule, and this site is meant to be fully crawlable: preview deployments are deindexed with an X-Robots-Tag header instead, which a Disallow would prevent the crawler from ever reading"

      - name: Verify the published _headers
        run: |
          set -euo pipefail
          . eng/ci-assert.sh

          P=site/BlazorCodeFirst.Site/bin/Release/net10.0/publish/wwwroot

          # _headers is an ordinary wwwroot file, so if it ever stopped being published NOTHING else
          # in this workflow would fail -- and the preview injection below appends with ">>", which
          # would create a fresh file and succeed, deploying a _headers that has only the noindex
          # rule and no immutable cache rule. Asserting the contents BEFORE any injection catches
          # file loss, rule loss, and a mis-ordered workflow with one check.
          assert_file "$P/_headers" "the publish output has no _headers file"
          assert_grep '^/_framework/\*$' "$P/_headers" "the /_framework/* rule is missing from _headers"
          # Losing this rule breaks nothing a reader would see: the fonts still arrive, just on every
          # visit instead of once a year. No other check here or in the browser suite reads a response
          # header, so nothing else would notice.
          assert_grep '^/fonts/\*$' "$P/_headers" "the /fonts/* rule is missing from _headers, so every self-hosted font is refetched on every visit"
          # Counted, not matched. Two rules freeze a path and their directive lines are identical, so
          # a presence check passes while EITHER rule is intact and cannot tell which one is. The
          # count fails in both directions: below two, a frozen path lost its directive; above two, a
          # third path was frozen without this assertion being revisited, which matters because
          # freezing a URL for a year is only safe where the name changes with the contents.
          assert_count '^  Cache-Control: public, max-age=31536000, immutable$' "$P/_headers" 2 "_headers must carry exactly two immutable cache directives, one under /_framework/* and one under /fonts/*"
          assert_grep '^/404$' "$P/_headers" "the /404 rule is missing from _headers"
          assert_grep '^  X-Robots-Tag: noindex$' "$P/_headers" "the /404 noindex directive is missing from _headers"
          # _headers is the third way to deindex production, and the only one the two guards added
          # with the public switch do not cover: adding a "/*" X-Robots-Tag rule to the COMMITTED
          # file would deindex every page while satisfying every presence assertion here. Counting
          # instead of matching is what closes that, and this step is the right home for it because
          # it runs on production and preview alike -- the post-injection assertions cannot do this
          # job, since by then a second rule is legitimately present on previews.
          #
          # Anchored to rule lines: the file explains this rule in prose, so an unanchored
          # 'X-Robots-Tag' counts the comment mentions too and can never equal 1.
          assert_count '^[[:space:]]*X-Robots-Tag:' "$P/_headers" 1 "the committed _headers must declare exactly one X-Robots-Tag rule (the /404 one); a second rule would deindex production"

      # Everything above this point asserts the publish output as text, which can prove the shell
      # rendered and the stylesheet links survived and cannot see anything the browser computes.
      # The suite below is that half: overflow, whether a clickable label fits, WCAG contrast, and
      # where the documentation rail lands (#251). It runs before the deploy so a failure stops the
      # bad deployment rather than describing it afterwards.
      #
      # Against the local publish output, not a deployment. Hydration behaviour and Cloudflare's
      # edge routing genuinely need one and are #47's subject, which is blocked on #66; none of
      # these four checks needs anything but the files and a static server.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/tests/browser/package-lock.json

      - run: npm ci
        working-directory: site/tests/browser

      # Playwright's loader transpiles the specs and throws their types away, so a type error here
      # runs green and shows up only as noise in a contributor's editor (#254). This is the only
      # thing in the repository that reads them. It runs before the browser download because it
      # takes seconds and needs nothing but node_modules.
      - run: npx tsc --noEmit
        working-directory: site/tests/browser

      # package-lock.json pins playwright-core exactly, and the browser revision is a function of
      # that version, so its hash is the right key for the downloaded browser.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('site/tests/browser/package-lock.json') }}

      - run: npx playwright install --with-deps chromium
        working-directory: site/tests/browser

      - name: Verify the published site in a browser
        id: browser
        run: npx playwright test
        working-directory: site/tests/browser

      # Conditioned on this step rather than on the job, so an earlier failure does not reach for a
      # directory that was never written.
      - if: failure() && steps.browser.conclusion == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: site-playwright-traces
          path: site/tests/browser/test-results

      - name: Inject the preview noindex header
        if: steps.target.outputs.environment == 'preview'
        run: |
          set -euo pipefail
          . eng/ci-assert.sh

          P=site/BlazorCodeFirst.Site/bin/Release/net10.0/publish/wwwroot

          # This rule is a hedge, not what actually deindexes a preview. Cloudflare documents no
          # default for Workers preview URLs, but measured on pr-340 they carry their own
          # X-Robots-Tag: noindex, and that value REPLACES what _headers sets for the same header
          # name: every preview path answered `noindex` rather than the `noindex, nofollow` written
          # below, while the same deployment's Cache-Control rules from _headers arrived intact.
          # So the `nofollow` does not reach a response today, and the rule earns its place only by
          # covering an undocumented default that could change.
          #
          # X-Robots-Tag only. robots.txt is deliberately NOT touched: "Disallow: /" stops the crawl,
          # so the crawler never reads the noindex and the two directives CANCEL rather than add.
          # The leading blank line keeps this a separate rule from the last one in the committed file.
          printf '\n/*\n  X-Robots-Tag: noindex, nofollow\n' >> "$P/_headers"

          assert_grep '^/\*$' "$P/_headers" "the injected preview rule has no /* path line"
          assert_grep '^  X-Robots-Tag: noindex, nofollow$' "$P/_headers" "the injected preview noindex directive is missing"

          # Re-assert the /_framework/* rule survived the append above. The step before this one
          # already proved the rule was present before the append; the only thing left to prove is
          # that ">>" stayed ">>" -- a future edit turning it into ">" would truncate the file to just
          # the preview rule while leaving the two assertions above (which only look at what THIS step
          # just wrote) passing.
          assert_grep '^/_framework/\*$' "$P/_headers" "the /_framework/* rule did not survive the preview append -- _headers was truncated instead of extended"
          assert_grep '^  Cache-Control: public, max-age=31536000, immutable$' "$P/_headers" "the immutable cache directive did not survive the preview append -- _headers was truncated instead of extended"

          echo "--- published _headers ---"
          cat "$P/_headers"

      # wrangler-action runs `npm i wrangler@4` in its workingDirectory whenever it does not already
      # find wrangler there, and that writes package.json and package-lock.json. At the default
      # working directory -- the repository root -- neither file is tracked and neither is ignored, so
      # the last step in this job would report the tree dirty and fail. Being ignored is what fixes
      # that: the `git status --porcelain` it runs carries no pathspec and reports the whole
      # repository no matter where the install happened.
      #
      # The package.json is written here rather than left to `npm i`, which resolves its install
      # prefix by walking up from the working directory until it finds a package.json or a
      # node_modules. Writing one pins the prefix to this directory instead of leaving it to whatever
      # happens to sit above the checkout on the runner.
      #
      # No fork/Dependabot condition, unlike the two steps below: with no deploy there is no install
      # and this directory is simply unused, which is cheaper than keeping a third copy of that
      # condition in step with the other two.
      - name: Prepare the wrangler install root
        run: |
          set -euo pipefail
          mkdir -p .wrangler-ci
          printf '%s\n' '{ "private": true }' > .wrangler-ci/package.json

      - name: Deploy to Cloudflare Workers
        id: deploy
        # A pull_request from a fork gets no secrets, so the deploy would FAIL rather than skip.
        # Test the head repository explicitly instead of probing for an empty secret.
        #
        # Dependabot needs its own test. Its branches live in this repository, so they pass the fork
        # check above, but a Dependabot-triggered run reads the Dependabot secret store rather than
        # the Actions one and would reach wrangler with an empty apiToken. Dependabot touches site/
        # because the four projects there hold inline package versions, so this fires often. A
        # dependency bump has no use for a preview URL; build and verification above still run.
        if: >-
          github.actor != 'dependabot[bot]'
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # See the step above for why the install root is moved off the repository root.
          workingDirectory: .wrangler-ci
          # `deploy` or `versions upload --preview-alias`, decided by the resolved target rather
          # than here (see that step). Everything else the command needs is in site/wrangler.jsonc,
          # including the assets directory: wrangler resolves that path against the configuration
          # file, not against this workingDirectory.
          command: ${{ steps.target.outputs.command }}

      - name: Comment the preview URL on the pull request
        # Same conditions as the deploy step: with no deployment there is no URL to post. The
        # Dependabot clause is independently necessary anyway, because a Dependabot-triggered run
        # gets a read-only GITHUB_TOKEN and `gh pr comment` would answer 403.
        if: >-
          github.event_name == 'pull_request'
          && github.actor != 'dependabot[bot]'
          && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ALIAS: ${{ steps.target.outputs.alias }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail

          # The alias URL is CONSTRUCTED rather than read from the step's output. wrangler-action
          # does set deployment-url for `versions upload`, but from an optional preview_url field
          # that is not documented to carry the alias rather than the version-prefixed URL -- and a
          # URL that changes on every push is exactly what setting an alias exists to avoid.
          #
          # deployment-url is still READ, as the proof that a version was uploaded at all. Emptiness
          # is the loud failure the previous `pages deploy` arrangement got from its alias output.
          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "::error::the versions upload step produced no preview URL" >&2
            exit 1
          fi
          url="https://$ALIAS-blazor-code-first-site.snsgr.workers.dev"

          # Says noindex, not "noindex, nofollow": Cloudflare's own preview header replaces the
          # injected value, so nofollow never reaches the response (see the injection step).
          body=$(printf 'Preview deploy: %s\n\nServed with `X-Robots-Tag: noindex`.\n' "$url")

          # Edit the bot's previous comment instead of stacking one per push. The `||` fallback covers
          # a gh build without --create-if-none.
          gh pr comment "$PR_NUMBER" --body "$body" --edit-last --create-if-none \
            || gh pr comment "$PR_NUMBER" --body "$body"

      # The invariant the install root above exists to hold: nothing in this job may leave a change
      # in the tracked tree. A job that writes into it has deployed something other than the commit
      # it claims to have deployed, and nothing else here would notice -- the publish output is
      # gitignored, so a stray write to a tracked source file changes what was built without
      # changing what is reported.
      #
      # A canary, not a gate. The deploy is several steps behind by now, so this cannot stop such a
      # deployment, only report that one happened. What it catches is the arrangement above
      # decaying: a wrangler-action release that installs somewhere else, or a new step that writes
      # into the tree. Either would otherwise surface as one warning line in the middle of a long
      # green log, which is how #282 went unnoticed for as long as it did.
      #
      # Last rather than immediately after the deploy, so that a dirty tree still gets its preview
      # URL commented; the step between them only calls `gh` and cannot dirty anything. It carries no
      # condition, so it runs whenever every step before it passed -- including the runs where the
      # deploy was skipped for a fork or for Dependabot, where a clean tree is equally expected.
      - name: Verify the job left the working tree clean
        run: |
          set -euo pipefail

          dirty=$(git status --porcelain)
          if [ -n "$dirty" ]; then
            echo "::error::the working tree is not clean, so what was deployed does not match the commit it was built from. Ignore whatever wrote the paths below, or stop it from writing there." >&2
            printf '%s\n' "$dirty" >&2
            exit 1
          fi
